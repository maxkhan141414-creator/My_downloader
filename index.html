<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="Instagram aur Facebook video downloader - Fast & Free">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>My Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .app-container {
            width: 100%; max-width: 420px;
            height: 95vh; max-height: 850px;
            background: linear-gradient(180deg, #0f1626 0%, #070a12 100%);
            display: flex; flex-direction: column;
            padding: 20px; position: relative;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .app-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .brand-title {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .platform-section {
            background: rgba(30,41,59,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; padding: 20px; margin-bottom: 20px;
        }
        .platform-buttons { display: flex; justify-content: space-around; gap: 15px; }
        .platform-btn {
            flex: 1; background: rgba(15,23,42,0.6);
            border: 2px solid transparent; border-radius: 20px;
            padding: 15px 10px; display: flex; flex-direction: column;
            align-items: center; gap: 10px; cursor: pointer;
            transition: all 0.3s ease;
        }
        .platform-btn.instagram i {
            background: linear-gradient(45deg,#f97316,#ec4899);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 38px;
        }
        .platform-btn.facebook i { color: #3b82f6; font-size: 38px; }
        .platform-btn span { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #94a3b8; }
        .platform-btn.active.instagram {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236,72,153,0.3);
            background: rgba(236,72,153,0.05);
        }
        .platform-btn.active.instagram span { color: #fff; }
        .platform-btn.active.facebook {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
            background: rgba(59,130,246,0.05);
        }
        .platform-btn.active.facebook span { color: #fff; }
        .input-section {
            background: rgba(30,41,59,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; padding: 20px; margin-bottom: 20px;
        }
        .input-area {
            position: relative; background: rgba(15,23,42,0.8);
            border: 1px solid rgba(56,189,248,0.2);
            border-radius: 16px; padding: 12px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .input-area textarea {
            width: 100%; height: 60px; background: transparent;
            border: none; outline: none; color: #fff;
            font-size: 14px; resize: none; font-weight: 500;
        }
        .input-area textarea::placeholder { color: #64748b; }
        .input-actions { display: flex; justify-content: flex-end; align-items: center; }
        .paste-btn {
            background: linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%);
            border: none; outline: none; color: white;
            padding: 8px 24px; border-radius: 30px;
            font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }
        .download-btn-container { margin-bottom: 20px; }
        .main-download-btn {
            width: 100%;
            background: linear-gradient(90deg,#0284c7 0%,#0ea5e9 100%);
            border: none; outline: none; border-radius: 50px;
            padding: 18px; color: white; font-size: 15px;
            font-weight: 800; letter-spacing: 0.5px;
            display: flex; justify-content: center; align-items: center;
            gap: 10px; cursor: pointer;
            box-shadow: 0 0 25px rgba(14,165,233,0.4);
            transition: all 0.3s ease;
        }
        .result-section {
            display: none; background: rgba(30,41,59,0.8);
            border: 2px solid #22c55e; border-radius: 16px;
            padding: 15px; margin-bottom: 20px; text-align: center;
        }
        .success-download-btn {
            width: 100%;
            background: linear-gradient(90deg,#22c55e 0%,#16a34a 100%);
            border: none; color: white; padding: 14px 25px;
            border-radius: 25px; font-weight: 700; font-size: 14px;
            cursor: pointer; margin-top: 10px; text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(34,197,94,0.4);
        }
        .progress-container {
            display: none; width: 100%;
            background-color: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 15px; overflow: hidden;
        }
        .progress-bar {
            width: 0%; height: 8px;
            background: linear-gradient(90deg,#22c55e,#3b82f6);
            transition: width 0.4s ease;
        }
        .progress-label {
            font-size: 11px; color: #94a3b8;
            margin-top: 6px; text-align: center;
        }

        /* ── HISTORY ── */
        .recent-section { flex-grow: 1; margin-bottom: 20px; }
        .recent-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 15px;
        }
        .recent-header h3 {
            font-size: 14px; color: #94a3b8;
            letter-spacing: 0.5px; font-weight: 700;
            display: flex; align-items: center; gap: 6px;
        }
        .history-count-badge {
            background: rgba(56,189,248,0.2); border-radius: 50px;
            padding: 2px 9px; font-size: 12px; font-weight: 700; color: #38bdf8;
        }
        .clear-history-btn {
            font-size: 12px; color: #ef4444; cursor: pointer;
            font-weight: 600; background: none; border: none;
        }
        .recent-grid {
            display: grid; grid-template-columns: repeat(4,1fr);
            gap: 10px; max-height: 240px; overflow-y: auto;
        }
        .recent-item {
            position: relative; aspect-ratio: 1/1;
            background: rgba(30,41,59,0.6); border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s ease;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        .recent-item.long-pressed {
            border-color: #ef4444;
            box-shadow: 0 0 10px rgba(239,68,68,0.4);
        }
        .recent-item .thumb-img {
            position: absolute; top:0; left:0;
            width:100%; height:100%; object-fit:cover; border-radius:11px;
        }
        .recent-item .thumb-label {
            position: absolute; bottom:0; left:0; right:0;
            background: linear-gradient(transparent,rgba(0,0,0,0.85));
            padding: 12px 3px 4px; font-size: 8px; color: #fff;
            text-align: center; border-radius: 0 0 11px 11px;
            font-weight: 600; letter-spacing: 0.3px;
        }
        .recent-item .play-badge {
            position: absolute; top:50%; left:50%;
            transform: translate(-50%,-58%);
            background: rgba(0,0,0,0.55); border-radius: 50%;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
        }
        .recent-item .play-badge i { font-size:11px; color:#fff; margin:0; }
        .recent-item .no-thumb-icon { font-size:20px; margin-bottom:4px; color:#94a3b8; }
        .recent-item .no-thumb-label { font-size:9px; color:#fff; text-align:center; padding:3px 2px; }

        /* ── ERROR TOAST ── */
        .error-toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg,#7f1d1d,#991b1b);
            border: 1px solid #ef4444;
            color: white; padding: 14px 20px;
            border-radius: 16px; font-size: 13px;
            font-weight: 600; z-index: 99999;
            animation: slideUp 0.3s ease;
            max-width: 340px; width: 90%;
            box-shadow: 0 4px 20px rgba(239,68,68,0.4);
            text-align: center; line-height: 1.5;
        }
        .error-toast .err-title {
            font-size: 14px; font-weight: 800;
            color: #fca5a5; margin-bottom: 4px;
            display: block;
        }
        .error-toast .err-sub {
            font-size: 11px; color: #fecaca; display: block; margin-top: 3px;
        }

        /* ── SUCCESS TOAST ── */
        .success-toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg,#14532d,#166534);
            border: 1px solid #22c55e;
            color: white; padding: 14px 20px;
            border-radius: 16px; font-size: 13px;
            font-weight: 600; z-index: 99999;
            animation: slideUp 0.3s ease;
            max-width: 340px; width: 90%;
            box-shadow: 0 4px 20px rgba(34,197,94,0.4);
            text-align: center; line-height: 1.5;
        }

        /* ── INFO TOAST ── */
        .notification {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: #22c55e; color: white;
            padding: 12px 20px; border-radius: 50px;
            font-size: 14px; font-weight: bold;
            z-index: 99999; animation: slideUp 0.3s ease;
            white-space: nowrap;
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateX(-50%) translateY(20px); }
            to   { opacity:1; transform:translateX(-50%) translateY(0); }
        }

        /* ── INTERNET OVERLAY ── */
        .no-internet-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.92); z-index: 9999;
            justify-content: center; align-items: center;
        }
        .no-internet-overlay.show { display: flex; }
        .no-internet-box {
            background: linear-gradient(145deg,#0f1e36,#0a1525);
            border: 1px solid #ef4444; border-radius: 24px;
            padding: 32px; text-align: center; max-width: 300px;
        }
        .no-internet-box h3 { margin: 16px 0 8px; font-size: 18px; }
        .no-internet-box p { font-size: 13px; color: #94a3b8; line-height: 1.5; }
        .no-internet-retry-btn {
            background: #ef4444; border: none; border-radius: 50px;
            padding: 12px 32px; color: white; font-weight: 700;
            cursor: pointer; margin-top: 20px; font-size: 14px;
        }

        /* ── SETTINGS MODAL ── */
        .settings-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85); z-index: 10000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        .settings-modal.show { display: flex; }
        .settings-box {
            background: linear-gradient(145deg,#0f1e36,#0a1525);
            border-radius: 32px; padding: 25px; width: 90%;
            max-width: 350px; border: 1px solid rgba(56,189,248,0.3);
        }
        .settings-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .settings-header h2 { font-size: 20px; color: #38bdf8; }
        .close-settings { background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; }
        .setting-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .setting-item label { font-size: 14px; color: #cbd5e1; }
        .toggle-switch {
            width: 44px; height: 24px; background: #334155;
            border-radius: 50px; cursor: pointer;
            position: relative; transition: 0.2s;
        }
        .toggle-switch.active { background: #22c55e; }
        .toggle-switch::after {
            content: ''; position: absolute;
            width: 20px; height: 20px; background: white;
            border-radius: 50%; top: 2px; left: 3px; transition: 0.2s;
        }
        .toggle-switch.active::after { left: 21px; }
        .stats-info {
            background: rgba(56,189,248,0.1); border-radius: 16px;
            padding: 15px; margin-top: 15px; text-align: center;
        }
        .stats-info p { font-size: 13px; color: #94a3b8; margin: 5px 0; }
        .stats-info .total-downloads { font-size: 24px; font-weight: 800; color: #38bdf8; }
        .loader { display:none; margin-left:10px; animation: spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- NO INTERNET OVERLAY -->
<div class="no-internet-overlay" id="noInternetOverlay">
    <div class="no-internet-box">
        <i class="fa-solid fa-wifi-slash" style="font-size:48px;color:#ef4444;"></i>
        <h3>इंटरनेट नहीं है!<br><small style="font-size:14px;color:#94a3b8;">No Internet</small></h3>
        <p>कृपया अपना WiFi या Mobile Data चालू करें।<br>
           <span style="color:#64748b;">Please turn on WiFi or Mobile Data.</span></p>
        <button class="no-internet-retry-btn" onclick="retryConnection()">
            🔄 दोबारा कोशिश करें / Retry
        </button>
    </div>
</div>

<!-- SETTINGS MODAL -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-box">
        <div class="settings-header">
            <h2><i class="fa-solid fa-gear"></i> सेटिंग्स</h2>
            <button class="close-settings" onclick="closeSettings()">&times;</button>
        </div>
        <div class="setting-item">
            <label><i class="fa-regular fa-bell"></i> नोटिफिकेशन</label>
            <div class="toggle-switch" id="notifToggle" onclick="toggleNotification()"></div>
        </div>
        <div class="setting-item">
            <label><i class="fa-regular fa-hard-drive"></i> हिस्ट्री सेव करें</label>
            <div class="toggle-switch active" id="historyToggle" onclick="toggleHistorySave()"></div>
        </div>
        <div class="stats-info">
            <p>📥 कुल डाउनलोड / Total Downloads</p>
            <p class="total-downloads" id="totalDownloadsCount">0</p>
            <p>🎉 आपका सफर जारी है!</p>
        </div>
    </div>
</div>

<div class="app-container">

    <!-- HEADER -->
    <div class="app-header">
        <div class="brand-title">MY DOWNLOADER</div>
    </div>

    <!-- PLATFORM -->
    <div class="platform-section">
        <div class="platform-buttons">
            <div class="platform-btn instagram active" onclick="selectPlatform('instagram')">
                <i class="fa-brands fa-square-instagram"></i>
                <span>INSTAGRAM</span>
            </div>
            <div class="platform-btn facebook" onclick="selectPlatform('facebook')">
                <i class="fa-brands fa-square-facebook"></i>
                <span>FACEBOOK</span>
            </div>
        </div>
    </div>

    <!-- INPUT -->
    <div class="input-section">
        <div class="input-area">
            <textarea id="videoLink" placeholder="यहाँ इंस्टाग्राम रील का लिंक पेस्ट करें..."></textarea>
            <div class="input-actions">
                <button class="paste-btn" onclick="pasteFromClipboard()">PASTE</button>
            </div>
        </div>
    </div>

    <!-- DOWNLOAD BTN -->
    <div class="download-btn-container">
        <button class="main-download-btn" id="mainBtn" onclick="startDownload()">
            <span id="btnText">DOWNLOAD VIDEO</span>
            <i class="fa-solid fa-arrow-down" id="btnIcon"></i>
            <i class="fa-solid fa-circle-notch loader" id="btnLoader"></i>
        </button>
    </div>

    <!-- RESULT BOX -->
    <div class="result-section" id="resultBox">
        <p id="videoTitleDisplay" style="font-size:13px;color:#cbd5e1;margin-bottom:8px;"></p>
        <p style="font-size:14px;color:#22c55e;font-weight:600;margin-bottom:5px;">✅ वीडियो मिल गया है!</p>
        <button onclick="downloadVideo()" class="success-download-btn" id="galleryBtn">
            ⬇️ Gallery में Save करें ⬇️
        </button>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-label" id="progressLabel"></p>
    </div>

    <!-- HISTORY -->
    <div class="recent-section">
        <div class="recent-header">
            <h3>
                <i class="fa-regular fa-clock"></i> RECENT DOWNLOADS
                <span class="history-count-badge" id="historyCount">0</span>
            </h3>
            <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
        </div>
        <div class="recent-grid" id="recentGrid"></div>
    </div>

</div>

<script>
// ═══════════════════════════════════════════════
//  API KEYS — सभी 14 intact
// ═══════════════════════════════════════════════
const API_KEY_A = "58ada1bb8amsh6604490a2fc0596p1fbce5jsn49a52a705e3b";
const API_KEY_B = "19bda3fefdmsh91eea806446b74ap1ea3dbjsne60d3dbce9fa";

let currentPlatform   = 'instagram';
let fetchedVideoUrl   = "";
let fetchedVideoImg   = "";
let currentVideoTitle = "";
let totalDownloads    = 0;
let notificationsEnabled = true;
let historyEnabled    = true;

// ═══════════════════════════════════════════════
//  ERROR SYSTEM — Hindi + English
// ═══════════════════════════════════════════════
const ERROR_MESSAGES = {
    NO_INTERNET: {
        title: "📵 इंटरनेट नहीं है! / No Internet",
        hi:    "WiFi या Mobile Data चालू करके दोबारा कोशिश करें।",
        en:    "Please turn on WiFi or Mobile Data and try again."
    },
    INVALID_LINK: {
        title: "🔗 गलत लिंक! / Invalid Link",
        hi:    "Instagram या Facebook का सही लिंक डालें।",
        en:    "Please paste a valid Instagram or Facebook link."
    },
    EMPTY_LINK: {
        title: "✏️ लिंक खाली है! / Link is Empty",
        hi:    "पहले वीडियो का लिंक पेस्ट करें।",
        en:    "Please paste the video link first."
    },
    ALL_API_FAILED: {
        title: "❌ वीडियो नहीं मिला! / Video Not Found",
        hi:    "सभी सर्वर ने जवाब नहीं दिया। लिंक सही है? दोबारा कोशिश करें।",
        en:    "All servers failed. Is the link correct? Please try again."
    },
    DOWNLOAD_CORS: {
        title: "⚠️ Download Error / डाउनलोड त्रुटि",
        hi:    "वीडियो डाउनलोड करने में दिक्कत आई। Browser में नया Tab खुलेगा — वहाँ से Save करें।",
        en:    "Could not auto-download. Video will open in a new tab — save it from there."
    },
    DOWNLOAD_STORAGE: {
        title: "💾 Storage Full / स्टोरेज भरी है",
        hi:    "फोन की Storage कम है। कुछ Files Delete करें और दोबारा कोशिश करें।",
        en:    "Your device storage is full. Free up space and try again."
    },
    DOWNLOAD_PERMISSION: {
        title: "🔒 Permission चाहिए / Permission Needed",
        hi:    "Gallery में Save करने की Permission दें। Settings → App → Permissions में जाएँ।",
        en:    "Allow storage permission. Go to Settings → App → Permissions."
    },
    TIMEOUT: {
        title: "⏱️ Timeout हो गया / Request Timeout",
        hi:    "Server ने जवाब नहीं दिया। Internet धीमा है? थोड़ी देर बाद कोशिश करें।",
        en:    "Server did not respond. Slow internet? Please try again after some time."
    },
    PRIVATE_VIDEO: {
        title: "🔒 Private Video",
        hi:    "यह वीडियो Private है। सिर्फ Public वीडियो Download हो सकते हैं।",
        en:    "This video is private. Only public videos can be downloaded."
    },
    SERVER_ERROR: {
        title: "🌐 Server Error",
        hi:    "Server में कुछ गड़बड़ है। थोड़ी देर बाद कोशिश करें।",
        en:    "Server is having issues. Please try again after some time."
    },
    UNKNOWN: {
        title: "⚠️ कुछ गड़बड़ हुई / Something went wrong",
        hi:    "अज्ञात त्रुटि आई। दोबारा कोशिश करें।",
        en:    "An unknown error occurred. Please try again."
    }
};

// Error दिखाओ — Hindi + English दोनों में
function showError(type, extra = "") {
    const msg = ERROR_MESSAGES[type] || ERROR_MESSAGES.UNKNOWN;
    removeAllToasts();
    const toast = document.createElement('div');
    toast.className = 'error-toast';
    toast.innerHTML = `
        <span class="err-title">${msg.title}</span>
        ${msg.hi}
        <span class="err-sub">${msg.en}</span>
        ${extra ? `<span class="err-sub" style="color:#fbbf24;margin-top:4px;">${extra}</span>` : ''}
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 5000);
}

// Success toast
function showSuccess(msgHi, msgEn = "") {
    removeAllToasts();
    const toast = document.createElement('div');
    toast.className = 'success-toast';
    toast.innerHTML = `${msgHi}${msgEn ? `<br><span style="font-size:11px;color:#bbf7d0;">${msgEn}</span>` : ''}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// Info notification
function showNotification(msg) {
    if (!notificationsEnabled) return;
    removeAllToasts();
    const notif = document.createElement('div');
    notif.className = 'notification';

// ═══════════════════════════════════════════════
//  MAIN DOWNLOAD FUNCTION
// ═══════════════════════════════════════════════
async function startDownload() {
    if (!checkInternet()) { showError('NO_INTERNET'); return; }

    const link = document.getElementById('videoLink').value.trim();
    if (!link)             { showError('EMPTY_LINK');   return; }
    if (!isValidUrl(link)) { showError('INVALID_LINK'); return; }

    // Private video check
    if (link.includes("/p/") && link.includes("?")) {
        // could be private — we'll try and catch later
    }

    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const btnLoad = document.getElementById('btnLoader');
    const mainBtn = document.getElementById('mainBtn');

    mainBtn.disabled = true;
    btnIcon.style.display = "none";
    btnLoad.style.display = "inline-block";
    btnText.innerText = "ढूंढ रहा है...";

    const apis = getApiConfigs(link);
    let videoData  = null;
    let allTimeout = true;

    for (let i = 0; i < apis.length; i++) {
        const cfg = apis[i];
        btnText.innerText = `API ${i+1}/${apis.length}...`;

        try {
            const ctrl = new AbortController();
            const tid  = setTimeout(() => ctrl.abort(), 8000);
            const opts = { method:cfg.method, headers:cfg.headers, signal:ctrl.signal };
            if (cfg.method === "POST" && cfg.body) opts.body = cfg.body;

            const resp = await fetch(cfg.url, opts);
            clearTimeout(tid);
            allTimeout = false;

            if (resp.status === 401 || resp.status === 403) {
                console.log(`🔒 ${cfg.name}: Auth error ${resp.status}`);
                continue;
            }
            if (resp.status >= 500) {
                console.log(`🌐 ${cfg.name}: Server error ${resp.status}`);
                continue;
            }

            if (resp.ok) {
                const json   = await resp.json();
                const parsed = cfg.parse(json);
                if (parsed?.url?.startsWith("http")) {
                    videoData = parsed;
                    console.log(`✅ ${cfg.name} success!`);
                    break;
                }
                // Private video hint
                if (json?.error?.includes?.("private") || json?.message?.includes?.("private")) {
                    mainBtn.disabled = false;
                    btnIcon.style.display = "inline-block";
                    btnLoad.style.display = "none";
                    btnText.innerText = "DOWNLOAD VIDEO";
                    showError('PRIVATE_VIDEO');
                    return;
                }
            }
        } catch(e) {
            if (e.name === 'AbortError') {
                console.log(`⏱️ ${cfg.name}: Timeout`);
            } else {
                console.log(`❌ ${cfg.name}: ${e.message}`);
                allTimeout = false;
            }
        }
    }

    mainBtn.disabled = false;
    btnIcon.style.display = "inline-block";
    btnLoad.style.display = "none";
    btnText.innerText = "DOWNLOAD VIDEO";

    if (videoData?.url) {
        fetchedVideoUrl   = videoData.url;
        fetchedVideoImg   = videoData.img || "";
        const ts = new Date().toISOString().slice(0,19).replace(/:/g,'-');
        currentVideoTitle = `${currentPlatform.toUpperCase()}_${ts}`;
        document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
        document.getElementById('resultBox').style.display = "block";
        document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'center'});
        showSuccess("✅ वीडियो मिल गया! / Video Found!", "अब Gallery में Save करें।");
    } else {
        if (allTimeout) {
            showError('TIMEOUT');
        } else {
            showError('ALL_API_FAILED');
        }
    }
}

// Anchor click helper
function triggerAnchorDownload(url, fileName) {
    const a = document.createElement('a');
    a.href          = url;
    a.download      = fileName;
    a.style.display = 'none';
    a.rel           = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { document.body.removeChild(a); } catch(e){} }, 1000);
}

        pCon.style.display = "none";

        pLabel.innerText   = "";
        btn.disabled       = false;

//  HISTORY — thumbnail + long press delete
// ═══════════════════════════════════════════════
function saveToHistory(name, url, img) {
    if (!historyEnabled) return;
    try {
        let hist = JSON.parse(localStorage.getItem("downloader_history") || "[]");
        if (!hist.some(h => h.url === url)) {
            hist.unshift({ name, url, img, platform: currentPlatform, date: new Date().toISOString() });
            if (hist.length > 20) hist.pop();
            localStorage.setItem("downloader_history", JSON.stringify(hist));
            loadHistory();
        }
    } catch(e) {}
}

function deleteHistoryItem(index) {
    try {
        let hist = JSON.parse(localStorage.getItem("downloader_history") || "[]");
        hist.splice(index, 1);
        localStorage.setItem("downloader_history", JSON.stringify(hist));
        loadHistory();
        showNotification("🗑️ हटा दिया गया / Deleted");
    } catch(e) {}
}

function loadHistory() {
    const grid = document.getElementById("recentGrid");
    grid.innerHTML = "";
    let hist = [];
    try { hist = JSON.parse(localStorage.getItem("downloader_history") || "[]"); } catch(e) {}

    updateHistoryCount();

    if (hist.length === 0) {
        grid.innerHTML = `<p style="grid-column:span 4;text-align:center;color:#64748b;padding:20px;font-size:12px;">कोई वीडियो नहीं<br><span style="color:#475569;">No downloads yet</span></p>`;
        return;
    }

    hist.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "recent-item";

                 if (item.img && item.img.startsWith("http")) {
            div.innerHTML = `
                <img class="thumb-img" src="${item.img}" 
                onerror="this.style.display='none'" 
                alt="thumb" loading="lazy">
                <div class="play-badge"><i class="fa-solid fa-play"></i></div>
                <div class="thumb-label">${item.name.substring(0,12)}</div>
            `;
        } else {
            div.innerHTML = `
                <i class="fa-solid fa-video no-thumb-icon"></i>
                <span class="no-thumb-label">${item.name.substring(0,12)}</span>
            `;
        }



        let pressTimer  = null;
        let isLongPress = false;

        // Mobile: Long press → Delete
        div.addEventListener('touchstart', () => {
            isLongPress = false;
            pressTimer  = setTimeout(() => {
                isLongPress = true;
                div.classList.add('long-pressed');
                if (confirm(`हटाएं? / Delete?\n"${item.name.substring(0,25)}"`)) {
                    deleteHistoryItem(index);
                } else {
                    div.classList.remove('long-pressed');
                }
            }, 600);
        }, { passive: true });

        div.addEventListener('touchend',  () => { clearTimeout(pressTimer); div.classList.remove('long-pressed'); });
        div.addEventListener('touchmove', () => { clearTimeout(pressTimer); div.classList.remove('long-pressed'); });

        // Desktop: Right click → Delete
        div.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (confirm(`हटाएं? / Delete?\n"${item.name.substring(0,25)}"`)) deleteHistoryItem(index);
        });

        // Single tap → Re-download
        div.addEventListener('click', () => {
            if (isLongPress) { isLongPress = false; return; }
            if (confirm(`दोबारा Download करें? / Re-download?\n"${item.name.substring(0,25)}"`)) {
                fetchedVideoUrl   = item.url;
                fetchedVideoImg   = item.img || "";
                currentVideoTitle = item.name;
                document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                document.getElementById('resultBox').style.display = "block";
                showNotification("✅ वीडियो लोड हुआ! / Loaded — Download करें");
                document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'center'});
            }
        });

        grid.appendChild(div);
    });
}

function clearHistory() {
    if (confirm("सारी हिस्ट्री हटाएं? / Clear all history?")) {
        localStorage.removeItem("downloader_history");
        loadHistory();
        showNotification("✅ हिस्ट्री क्लियर / History Cleared");
    }
}

// ═══════════════════════════════════════════════
//  PWA — Service Worker (GitHub Pages fix)
// ═══════════════════════════════════════════════
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(r  => console.log('✅ SW registered:', r.scope))
            .catch(e => console.warn('SW failed:', e));
    });
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
loadSettings();
loadHistory();
setTimeout(checkInternet, 500);
</script>
