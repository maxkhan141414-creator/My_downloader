<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="Instagram aur Facebook video downloader - Fast & Free">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>My Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ── रिसेट और बेस स्टाइल ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* ── मोबाइल कंटेनर ── */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0f1626 0%, #070a12 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: relative;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        /* ── हेडर सेक्शन (Header + Counter + Settings) ── */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .download-counter {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 50px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
        }

        .settings-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .settings-btn:hover { color: #38bdf8; }

        /* ── प्लेटफार्म सिलेक्शन ── */
        .platform-section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .platform-buttons {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .platform-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .platform-btn.instagram i {
            background: linear-gradient(45deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 38px;
        }

        .platform-btn.facebook i { color: #3b82f6; font-size: 38px; }

        .platform-btn span {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #94a3b8;
        }

        .platform-btn.active.instagram {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
            background: rgba(236, 72, 153, 0.05);
        }
        .platform-btn.active.instagram span { color: #ffffff; }

        .platform-btn.active.facebook {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            background: rgba(59, 130, 246, 0.05);
        }
        .platform-btn.active.facebook span { color: #ffffff; }

        /* ── इनपुट बॉक्स ── */
        .input-section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-area {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-area textarea {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            resize: none;
            font-weight: 500;
        }

        .input-area textarea::placeholder { color: #64748b; }

        .input-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .paste-btn {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            border: none;
            outline: none;
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        /* ── डाउनलोड बटन ── */
        .download-btn-container { margin-bottom: 20px; }

        .main-download-btn {
            width: 100%;
            background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
            border: none;
            outline: none;
            border-radius: 50px;
            padding: 18px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }

        /* रिजल्ट डाउनलोड बॉक्स */
        .result-section {
            display: none;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #22c55e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-download-btn {
            width: 100%;
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
            border: none;
            color: white;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        /* प्रोग्रेस बार */
        .progress-container {
            display: none;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            transition: width 0.3s ease;
        }

        /* ── रिसेंट डाउनलोड्स (HISTORY SECTION) ── */
        .recent-section { flex-grow: 1; margin-bottom: 20px; }
        .recent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .recent-header h3 { font-size: 14px; color: #94a3b8; letter-spacing: 0.5px; font-weight: 700; }
        .clear-history-btn { font-size: 12px; color: #ef4444; cursor: pointer; font-weight: 600; background: none; border: none; }

        .recent-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
        }

        .recent-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #38bdf8;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            overflow: hidden;
        }

        .recent-item i { font-size: 20px; margin-bottom: 4px; color: #94a3b8; }
        .recent-item span {
            font-size: 9px;
            color: #ffffff;
            text-align: center;
            padding: 3px 2px;
        }

        /* ── SETTINGS MODAL ── */
        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .settings-modal.show { display: flex; }

        .settings-box {
            background: linear-gradient(145deg, #0f1e36, #0a1525);
            border-radius: 32px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .settings-header h2 { font-size: 20px; color: #38bdf8; }
        .close-settings { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .setting-item label { font-size: 14px; color: #cbd5e1; }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #334155;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }
        .toggle-switch.active { background: #22c55e; }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 3px;
            transition: 0.2s;
        }
        .toggle-switch.active::after { left: 21px; }

        .stats-info {
            background: rgba(56, 189, 248, 0.1);
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }

        .stats-info p { font-size: 13px; color: #94a3b8; margin: 5px 0; }
        .stats-info .total-downloads { font-size: 24px; font-weight: 800; color: #38bdf8; }

        /* लोडर */
        .loader { display: none; margin-left: 10px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* नोटिफिकेशन */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .no-internet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .no-internet-overlay.show { display: flex; }
        .no-internet-box {
            background: #0f1e36;
            border: 1px solid #ef4444;
            border-radius: 24px;
            padding: 32px;
            text-align: center;
        }
        .no-internet-retry-btn {
            background: #ef4444;
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        button:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- NO INTERNET OVERLAY -->
    <div class="no-internet-overlay" id="noInternetOverlay">
        <div class="no-internet-box">
            <i class="fa-solid fa-wifi" style="font-size: 48px; color: #ef4444;"></i>
            <h3 style="margin-top: 16px;">इंटरनेट नहीं है!</h3>
            <button class="no-internet-retry-btn" onclick="retryConnection()">दोबारा कोशिश करें</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-box">
            <div class="settings-header">
                <h2><i class="fa-solid fa-gear"></i> सेटिंग्स</h2>
                <button class="close-settings" onclick="closeSettings()">&times;</button>
            </div>
            <div class="setting-item">
                <label><i class="fa-regular fa-bell"></i> नोटिफिकेशन</label>
                <div class="toggle-switch" id="notifToggle" onclick="toggleNotification()"></div>
            </div>
            <div class="setting-item">
                <label><i class="fa-regular fa-hard-drive"></i> हिस्ट्री सेव करें</label>
                <div class="toggle-switch active" id="historyToggle" onclick="toggleHistorySave()"></div>
            </div>
            <div class="stats-info">
                <p>📥 कुल डाउनलोड</p>
                <p class="total-downloads" id="totalDownloadsCount">0</p>
                <p>🎉 आपका सफर जारी है!</p>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- HEADER WITH COUNTER & SETTINGS -->
        <div class="app-header">
            <div class="brand-title">MY DOWNLOADER</div>
            <div class="header-right">
                <span class="download-counter" id="downloadCounter">0</span>
                <button class="settings-btn" onclick="openSettings()"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <div class="platform-section">
            <div class="platform-buttons">
                <div class="platform-btn instagram active" onclick="selectPlatform('instagram')">
                    <i class="fa-brands fa-square-instagram"></i>
                    <span>INSTAGRAM</span>
                </div>
                <div class="platform-btn facebook" onclick="selectPlatform('facebook')">
                    <i class="fa-brands fa-square-facebook"></i>
                    <span>FACEBOOK</span>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-area">
                <textarea id="videoLink" placeholder="यहाँ इंस्टाग्राम रील का लिंक पेस्ट करें..."></textarea>
                <div class="input-actions">
                    <button class="paste-btn" onclick="pasteFromClipboard()">PASTE</button>
                </div>
            </div>
        </div>

        <div class="download-btn-container">
            <button class="main-download-btn" id="mainBtn" onclick="startDownload()">
                <span id="btnText">DOWNLOAD VIDEO</span>
                <i class="fa-solid fa-arrow-down" id="btnIcon"></i>
                <i class="fa-solid fa-circle-notch loader" id="btnLoader"></i>
            </button>
        </div>

        <div class="result-section" id="resultBox">
            <p id="videoTitleDisplay" style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;"></p>
            <p style="font-size: 14px; color: #22c55e; font-weight: 600; margin-bottom: 5px;">वीडियो मिल गया है!</p>
            <button onclick="downloadVideo()" class="success-download-btn" id="galleryBtn">⬇️ वीडियो डाउनलोड करें ⬇️</button>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="recent-section">
            <div class="recent-header">
                <h3><i class="fa-regular fa-clock"></i> RECENT DOWNLOADS (HISTORY)</h3>
                <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
            </div>
            <div class="recent-grid" id="recentGrid"></div>
        </div>
    </div>

    <script>
        // ========== ⚠️ PURE WEB-ONLY - NO CORDOVA, NO ADMOB ==========
        
        // API Keys (सभी 14 APIs intact)
        const API_KEY_A = "58ada1bb8amsh6604490a2fc0596p1fbce5jsn49a52a705e3b";
        const API_KEY_B = "19bda3fefdmsh91eea806446b74ap1ea3dbjsne60d3dbce9fa";

        let currentPlatform = 'instagram';
        let fetchedVideoUrl = "";
        let fetchedVideoImg = "";
        let currentVideoTitle = "";
        let totalDownloads = 0;
        let notificationsEnabled = true;
        let historyEnabled = true;

        // ========== LOAD SAVED SETTINGS ==========
        function loadSettings() {
            try {
                const saved = localStorage.getItem("downloader_settings");
                if (saved) {
                    const settings = JSON.parse(saved);
                    notificationsEnabled = settings.notifications !== false;
                    historyEnabled = settings.history !== false;
                }
                totalDownloads = parseInt(localStorage.getItem("total_downloads") || "0");
                updateCounter();
            } catch(e) {}
            
            // Update toggle UI
            const notifToggle = document.getElementById('notifToggle');
            const historyToggle = document.getElementById('historyToggle');
            if (notificationsEnabled) notifToggle.classList.add('active');
            else notifToggle.classList.remove('active');
            if (historyEnabled) historyToggle.classList.add('active');
            else historyToggle.classList.remove('active');
            
            document.getElementById('totalDownloadsCount').innerText = totalDownloads;
        }

        function saveSettings() {
            localStorage.setItem("downloader_settings", JSON.stringify({
                notifications: notificationsEnabled,
                history: historyEnabled
            }));
        }

        function toggleNotification() {
            notificationsEnabled = !notificationsEnabled;
            const toggle = document.getElementById('notifToggle');
            if (notificationsEnabled) toggle.classList.add('active');
            else toggle.classList.remove('active');
            saveSettings();
            showNotification(notificationsEnabled ? "नोटिफिकेशन ऑन" : "नोटिफिकेशन ऑफ");
        }

        function toggleHistorySave() {
            historyEnabled = !historyEnabled;
            const toggle = document.getElementById('historyToggle');
            if (historyEnabled) toggle.classList.add('active');
            else toggle.classList.remove('active');
            saveSettings();
            if (!historyEnabled) {
                showNotification("हिस्ट्री सेव बंद कर दी गई");
            }
        }

        function updateCounter() {
            document.getElementById('downloadCounter').innerText = totalDownloads;
            document.getElementById('totalDownloadsCount').innerText = totalDownloads;
        }

        function incrementDownloadCount() {
            totalDownloads++;
            localStorage.setItem("total_downloads", totalDownloads);
            updateCounter();
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        // ========== INTERNET CHECK ==========
        function checkInternet() {
            if (!navigator.onLine) {
                document.getElementById('noInternetOverlay').classList.add('show');
                return false;
            }
            document.getElementById('noInternetOverlay').classList.remove('show');
            return true;
        }

        function retryConnection() {
            if (navigator.onLine) {
                document.getElementById('noInternetOverlay').classList.remove('show');
            } else {
                alert("अभी भी इंटरनेट कनेक्ट नहीं है।");
            }
        }

        window.addEventListener('online', () => document.getElementById('noInternetOverlay').classList.remove('show'));
        window.addEventListener('offline', () => document.getElementById('noInternetOverlay').classList.add('show'));

        // ========== CLIPBOARD (Pure Web API) ==========
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('videoLink').value = text.trim();
                if (text.includes("facebook.com")) selectPlatform('facebook');
                showNotification("✅ लिंक पेस्ट हो गया!");
            } catch(e) {
                const manual = prompt("लिंक यहाँ डालें:");
                if (manual) document.getElementById('videoLink').value = manual.trim();
            }
        }

        function selectPlatform(platform) {
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.platform-btn.${platform}`).classList.add('active');
            document.getElementById('videoLink').value = "";
            document.getElementById('resultBox').style.display = 'none';
            fetchedVideoUrl = "";
        }

        function isValidUrl(text) {
            return text.includes("instagram.com") || text.includes("facebook.com") || text.includes("fb.watch");
        }

        function showNotification(msg) {
            if (!notificationsEnabled) return;
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // ========== 14 APIs (सभी intact) ==========
        function getApiConfigs(link) {
            return [
                {
                    name: "Snap Video API",
                    url: "https://snap-video3.p.rapidapi.com/download",
                    method: "POST",
                    headers: {
                        "x-rapidapi-host": "snap-video3.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A,
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: 'url=' + encodeURIComponent(link),
                    parse: (res) => {
                        if (res && res.medias && res.medias.length > 0) {
                            const best = res.medias.find(m => m.videoAvailable && m.audioAvailable) || res.medias[0];
                            return { url: best.url, title: res.title || "Snap_Video", img: res.thumbnail || "" };
                        }
                        return null;
                    }
                },
                {
                    name: "All In One Media Downloader",
                    url: `https://all-in-one-media-downloader-api.p.rapidapi.com/download?url=${encodeURIComponent(link)}`,
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "all-in-one-media-downloader-api.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A
                    },
                    body: null,
                    parse: (res) => {
                        if (res && res.url) return { url: res.url, title: res.title || "Media_Video", img: res.thumbnail || "" };
                        if (res && res.links && res.links[0]) return { url: res.links[0].url, title: res.title || "Media_Video", img: res.thumbnail || "" };
                        return null;
                    }
                },
                {
                    name: "Instagram Video Image Downloader",
                    url: `https://instagram-video-image-downloader.p.rapidapi.com/igdl?url=${encodeURIComponent(link)}`,
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "instagram-video-image-downloader.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A
                    },

        // ========== MAIN DOWNLOAD FUNCTION ==========
        async function startDownload() {
            if (!checkInternet()) return;

            const link = document.getElementById('videoLink').value.trim();
            if (!link) {
                alert("कृपया लिंक डालें!");
                return;
            }
            if (!isValidUrl(link)) {
                alert("कृपया सही Instagram या Facebook लिंक डालें!");
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainBtn');

            mainBtn.disabled = true;
            btnIcon.style.display = "none";
            btnLoader.style.display = "inline-block";
            btnText.innerText = "वीडियो ढूंढ रहा है...";

            const apiConfigs = getApiConfigs(link);
            let videoData = null;

            for (let i = 0; i < apiConfigs.length; i++) {
                const config = apiConfigs[i];
                btnText.innerText = `API ${i+1}/${apiConfigs.length} चल रही है...`;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    const fetchOptions = {
                        method: config.method,
                        headers: config.headers,
                        signal: controller.signal
                    };
                    if (config.method === "POST" && config.body) {
                        fetchOptions.body = config.body;
                    }

                    const response = await fetch(config.url, fetchOptions);
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        const parsed = config.parse(result);
                        if (parsed && parsed.url && parsed.url.startsWith("http")) {
                            videoData = parsed;
                            console.log(`✅ ${config.name} success!`);
                            break;
                        }
                    }
                } catch(e) {
                    console.log(`❌ ${config.name} failed: ${e.message}`);
                }
            }

            mainBtn.disabled = false;
            btnIcon.style.display = "inline-block";
            btnLoader.style.display = "none";
            btnText.innerText = "DOWNLOAD VIDEO";

            if (videoData && videoData.url) {
                fetchedVideoUrl = videoData.url;
                fetchedVideoImg = videoData.img || "";
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                currentVideoTitle = `${currentPlatform.toUpperCase()}_${timestamp}`;
                document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                document.getElementById('resultBox').style.display = "block";
                showNotification("✅ वीडियो मिल गया! अब डाउनलोड करें");
            } else {
                alert("❌ वीडियो नहीं मिला। लिंक चेक करें या बाद में कोशिश करें।");
            }
        }

        // ========== ✅ PURE WEB DOWNLOAD - NO REDIRECT! ==========
        async function downloadVideo() {
            if (!fetchedVideoUrl) {
                alert("पहले वीडियो ढूंढें!");
                return;
            }

            const galleryBtn = document.getElementById('galleryBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            galleryBtn.disabled = true;
            galleryBtn.innerText = "⏳ डाउनलोड हो रहा है...";
            progressContainer.style.display = "block";
            progressBar.style.width = "20%";

            try {
                progressBar.style.width = "50%";
                const response = await fetch(fetchedVideoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                progressBar.style.width = "80%";
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 100);
                
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ डाउनलोड हो गया!";
                showNotification(`✅ ${currentVideoTitle}.mp4 डाउनलोड शुरू!`);
                
                incrementDownloadCount();
                saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
                
            } catch(error) {
                console.log("Blob download failed, trying direct link:", error);
                
                progressBar.style.width = "80%";
                const a = document.createElement('a');
                a.href = fetchedVideoUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.target = "_blank";
                a.click();
                
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ डाउनलोड शुरू!";
                showNotification(`✅ डाउनलोड शुरू हो गया है!`);
                
                incrementDownloadCount();
                saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
            }

            setTimeout(() => {
                progressContainer.style.display = "none";
                galleryBtn.disabled = false;
                galleryBtn.innerText = "⬇️ वीडियो डाउनलोड करें ⬇️";
            }, 3000);
        }

        // ========== HISTORY FUNCTIONS ==========
        function saveToHistory(name, url, img) {
            if (!historyEnabled) return;
            try {
                let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
                if (!history.some(h => h.url === url)) {
                    history.unshift({ name, url, img, platform: currentPlatform, date: new Date().toISOString() });
                    if (history.length > 20) history.pop();
                    localStorage.setItem("downloader_history", JSON.stringify(history));
                    loadHistory();
                }
            } catch(e) {}
        }

        function loadHistory() {
            const grid = document.getElementById("recentGrid");
            grid.innerHTML = "";
            let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
            
            if (history.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 4; text-align: center; color: #64748b; padding: 20px;">कोई वीडियो नहीं</p>`;
                return;
            }
            
            history.forEach(item => {
                const div = document.createElement("div");
                div.className = "recent-item";
                div.onclick = () => {
                    // ✅ REDOWNLOAD functionality - पुराना वीडियो फिर से डाउनलोड करो
                    fetchedVideoUrl = item.url;
                    currentVideoTitle = item.name;
                    document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                    document.getElementById('resultBox').style.display = "block";
                    showNotification("✅ वीडियो लोड हो गया! डाउनलोड करें");
                };
                div.innerHTML = `<i class="fa-solid fa-video"></i><span>${item.name.substring(0, 12)}</span>`;
                grid.appendChild(div);
            });
        }

        function clearHistory() {
            if (confirm("हिस्ट्री डिलीट करें?")) {
                localStorage.removeItem("downloader_history");
                loadHistory();
                showNotification("हिस्ट्री क्लियर हो गई");
            }
        }

        // ========== PWA REGISTRATION ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker registered:', reg);
                }).catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }

        // ========== INIT ==========
        loadSettings();
        loadHistory();
        setTimeout(checkInternet, 500);
    </script>
