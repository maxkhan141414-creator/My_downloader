<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f19">
    <meta name="description" content="Instagram & Facebook Video Downloader - Fast & Free">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>My Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background-color:#0b0f19; color:#ffffff; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:10px; }
        .app-container { width:100%; max-width:420px; height:95vh; max-height:850px; background:linear-gradient(180deg,#0f1626 0%,#070a12 100%); display:flex; flex-direction:column; padding:20px; position:relative; border-radius:30px; box-shadow:0 20px 40px rgba(0,0,0,0.5); overflow-y:auto; }
        .app-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
        .brand-title { font-size:22px; font-weight:800; background:linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .platform-section { background:rgba(30,41,59,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:24px; padding:20px; margin-bottom:20px; }
        .platform-buttons { display:flex; justify-content:space-around; gap:15px; }
        .platform-btn { flex:1; background:rgba(15,23,42,0.6); border:2px solid transparent; border-radius:20px; padding:15px 10px; display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; transition:all 0.3s ease; }
        .platform-btn.instagram i { background:linear-gradient(45deg,#f97316,#ec4899); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:38px; }
        .platform-btn.facebook i { color:#3b82f6; font-size:38px; }
        .platform-btn span { font-size:12px; font-weight:700; letter-spacing:0.5px; color:#94a3b8; }
        .platform-btn.active.instagram { border-color:#ec4899; box-shadow:0 0 20px rgba(236,72,153,0.3); background:rgba(236,72,153,0.05); }
        .platform-btn.active.instagram span { color:#fff; }
        .platform-btn.active.facebook { border-color:#3b82f6; box-shadow:0 0 20px rgba(59,130,246,0.3); background:rgba(59,130,246,0.05); }
        .platform-btn.active.facebook span { color:#fff; }
        .input-section { background:rgba(30,41,59,0.4); border:1px solid rgba(255,255,255,0.05); border-radius:24px; padding:20px; margin-bottom:20px; }
        .input-area { position:relative; background:rgba(15,23,42,0.8); border:1px solid rgba(56,189,248,0.2); border-radius:16px; padding:12px; display:flex; flex-direction:column; gap:15px; }
        .input-area textarea { width:100%; height:60px; background:transparent; border:none; outline:none; color:#fff; font-size:14px; resize:none; font-weight:500; padding-right:32px; }
        .input-area textarea::placeholder { color:#64748b; }
        .clear-input-btn {
            position:absolute; bottom:12px; right:12px; background:rgba(30,41,59,0.8); border:1px solid rgba(56,189,248,0.3); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; z-index:2; color:#94a3b8; font-size:14px; font-weight:bold;
        }
        .clear-input-btn:hover { background:#ef4444; color:#fff; border-color:#ef4444; }
        .input-actions { display:flex; justify-content:flex-end; align-items:center; }
        .paste-btn { background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%); border:none; outline:none; color:white; padding:8px 24px; border-radius:30px; font-size:13px; font-weight:700; letter-spacing:0.5px; cursor:pointer; box-shadow:0 4px 12px rgba(37,99,235,0.3); }
        .download-btn-container { margin-bottom:20px; }
        .main-download-btn { width:100%; background:linear-gradient(90deg,#0284c7 0%,#0ea5e9 100%); border:none; outline:none; border-radius:50px; padding:18px; color:white; font-size:15px; font-weight:800; letter-spacing:0.5px; display:flex; justify-content:center; align-items:center; gap:10px; cursor:pointer; box-shadow:0 0 25px rgba(14,165,233,0.4); transition:all 0.3s ease; }
        .result-section { display:none; background:rgba(30,41,59,0.8); border:2px solid #22c55e; border-radius:16px; padding:15px; margin-bottom:20px; text-align:center; }
        .success-download-btn { width:100%; background:linear-gradient(90deg,#22c55e 0%,#16a34a 100%); border:none; color:white; padding:14px 25px; border-radius:25px; font-weight:700; font-size:14px; cursor:pointer; margin-top:10px; text-decoration:none; display:inline-block; box-shadow:0 4px 15px rgba(34,197,94,0.4); }
        .progress-container { display:none; width:100%; background-color:rgba(255,255,255,0.1); border-radius:10px; margin-top:15px; overflow:hidden; }
        .progress-bar { width:0%; height:8px; background:linear-gradient(90deg,#22c55e,#3b82f6); transition:width 0.4s ease; }
        .progress-label { font-size:11px; color:#94a3b8; margin-top:6px; text-align:center; }
        .recent-section { flex-grow:1; margin-bottom:20px; }
        .recent-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; }
        .recent-header h3 { font-size:14px; color:#94a3b8; letter-spacing:0.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
        .history-count-badge { background:rgba(56,189,248,0.2); border-radius:50px; padding:2px 9px; font-size:12px; font-weight:700; color:#38bdf8; }
        .clear-history-btn { font-size:12px; color:#ef4444; cursor:pointer; font-weight:600; background:none; border:none; }
        .recent-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-height:240px; overflow-y:auto; }
        .recent-item { position:relative; aspect-ratio:1/1; background:rgba(30,41,59,0.6); border-radius:12px; border:1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; transition:all 0.2s ease; overflow:hidden; user-select:none; -webkit-user-select:none; }
        .recent-item.long-pressed { border-color:#ef4444; box-shadow:0 0 10px rgba(239,68,68,0.4); }
        .recent-item .thumb-img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; border-radius:11px; }
        .recent-item .thumb-label { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.85)); padding:12px 3px 4px; font-size:8px; color:#fff; text-align:center; border-radius:0 0 11px 11px; font-weight:600; }
        .recent-item .play-badge { position:absolute; top:50%; left:50%; transform:translate(-50%,-58%); background:rgba(0,0,0,0.55); border-radius:50%; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }

        /* --- CUSTOM MODALS (Dark Theme) --- */
        .custom-modal-overlay {
            display: none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:20000; justify-content:center; align-items:center;
        }
        .custom-modal-overlay.show { display:flex; }
        .custom-modal {
            background:linear-gradient(145deg,#0f1e36,#0a1525); border:1px solid rgba(56,189,248,0.4); border-radius:32px; width:85%; max-width:340px; padding:24px 20px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.6);
        }
        .action-modal { max-width:280px; padding:20px; }
        .action-buttons { display:flex; gap:20px; justify-content:center; margin-top:20px; }
        .action-btn { background:rgba(30,41,59,0.8); border:1px solid rgba(56,189,248,0.3); border-radius:50px; padding:12px 20px; color:#fff; font-weight:600; display:flex; align-items:center; gap:10px; cursor:pointer; transition:0.2s; flex:1; justify-content:center; }
        .action-btn.delete { border-color:#ef4444; color:#ef4444; }
        .action-btn.delete:active { background:#ef4444; color:#fff; }
        .action-btn.share:active { background:#38bdf8; color:#fff; border-color:#38bdf8; }
        .modal-title { font-size:18px; font-weight:700; margin-bottom:12px; color:#38bdf8; }
        .modal-message { font-size:14px; color:#cbd5e1; margin-bottom:20px; line-height:1.5; }
        .confirm-buttons { display:flex; gap:15px; justify-content:center; margin-top:10px; }
        .confirm-btn { background:rgba(30,41,59,0.8); border:1px solid rgba(255,255,255,0.2); border-radius:40px; padding:10px 20px; font-weight:600; cursor:pointer; flex:1; }
        .confirm-btn.yes { background:#ef4444; border-color:#ef4444; color:white; }
        .confirm-btn.no { background:#334155; }
        .close-modal-btn { background:none; border:none; color:#94a3b8; font-size:24px; position:absolute; top:15px; right:20px; cursor:pointer; }

        /* Video Preview Modal */
        .video-preview-modal .custom-modal { width:90%; max-width:400px; padding:16px; border-radius:24px; background:linear-gradient(145deg,#0a1525,#030a18); }
        .video-preview-container { width:100%; border-radius:16px; overflow:hidden; background:#000; margin-bottom:16px; }
        .video-preview-container video { width:100%; max-height:50vh; outline:none; display:block; }
        .preview-download-btn { background:linear-gradient(90deg,#22c55e,#16a34a); border:none; border-radius:50px; padding:12px; width:100%; color:white; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; margin-top:10px; transition:0.2s; }
        .preview-close-btn { background:rgba(30,41,59,0.8); border:1px solid rgba(56,189,248,0.3); border-radius:50px; padding:8px; width:100%; margin-top:8px; color:#94a3b8; font-weight:600; cursor:pointer; }

        /* error / success toasts */
        .error-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#7f1d1d,#991b1b); border:1px solid #ef4444; color:white; padding:14px 20px; border-radius:16px; font-size:13px; font-weight:600; z-index:99999; animation:slideUp 0.3s ease; max-width:340px; width:90%; box-shadow:0 4px 20px rgba(239,68,68,0.4); text-align:center; line-height:1.6; }
        .error-toast .err-title { font-size:14px; font-weight:800; color:#fca5a5; margin-bottom:4px; display:block; }
        .error-toast .err-sub { font-size:11px; color:#fecaca; display:block; margin-top:3px; }
        .success-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#14532d,#166534); border:1px solid #22c55e; color:white; padding:14px 20px; border-radius:16px; font-size:13px; font-weight:600; z-index:99999; animation:slideUp 0.3s ease; max-width:340px; width:90%; box-shadow:0 4px 20px rgba(34,197,94,0.4); text-align:center; line-height:1.6; }
        .notification { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#22c55e; color:white; padding:12px 20px; border-radius:50px; font-size:14px; font-weight:bold; z-index:99999; animation:slideUp 0.3s ease; white-space:nowrap; }
        @keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
        .no-internet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; }
        .no-internet-overlay.show { display:flex; }
        .no-internet-box { background:linear-gradient(145deg,#0f1e36,#0a1525); border:1px solid #ef4444; border-radius:24px; padding:32px; text-align:center; max-width:300px; }
        .no-internet-box h3 { margin:16px 0 8px; font-size:18px; }
        .no-internet-box p { font-size:13px; color:#94a3b8; line-height:1.5; }
        .no-internet-retry-btn { background:#ef4444; border:none; border-radius:50px; padding:12px 32px; color:white; font-weight:700; cursor:pointer; margin-top:20px; font-size:14px; }
        .settings-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center; backdrop-filter:blur(5px); }
        .settings-modal.show { display:flex; }
        .settings-box { background:linear-gradient(145deg,#0f1e36,#0a1525); border-radius:32px; padding:25px; width:90%; max-width:350px; border:1px solid rgba(56,189,248,0.3); }
        .settings-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .settings-header h2 { font-size:20px; color:#38bdf8; }
        .close-settings { background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; }
        .setting-item { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
        .setting-item label { font-size:14px; color:#cbd5e1; }
        .toggle-switch { width:44px; height:24px; background:#334155; border-radius:50px; cursor:pointer; position:relative; transition:0.2s; }
        .toggle-switch.active { background:#22c55e; }
        .toggle-switch::after { content:''; position:absolute; width:20px; height:20px; background:white; border-radius:50%; top:2px; left:3px; transition:0.2s; }
        .toggle-switch.active::after { left:21px; }
        .stats-info { background:rgba(56,189,248,0.1); border-radius:16px; padding:15px; margin-top:15px; text-align:center; }
        .stats-info p { font-size:13px; color:#94a3b8; margin:5px 0; }
        .stats-info .total-downloads { font-size:24px; font-weight:800; color:#38bdf8; }
        .loader { display:none; margin-left:10px; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        button:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
</head>
<body>

<!-- no internet overlay -->
<div class="no-internet-overlay" id="noInternetOverlay">
    <div class="no-internet-box">
        <i class="fa-solid fa-wifi" style="font-size:48px;color:#ef4444;"></i>
        <h3>No Internet Connection!</h3>
        <p>Please turn on WiFi or Mobile Data and try again.</p>
        <button class="no-internet-retry-btn" onclick="retryConnection()">🔄 Retry</button>
    </div>
</div>

<!-- settings modal -->
<div class="settings-modal" id="settingsModal">
    <div class="settings-box">
        <div class="settings-header">
            <h2><i class="fa-solid fa-gear"></i> Settings</h2>
            <button class="close-settings" onclick="closeSettings()">&times;</button>
        </div>
        <div class="setting-item">
            <label><i class="fa-regular fa-bell"></i> Notifications</label>
            <div class="toggle-switch" id="notifToggle" onclick="toggleNotification()"></div>
        </div>
        <div class="setting-item">
            <label><i class="fa-regular fa-hard-drive"></i> Save History</label>
            <div class="toggle-switch active" id="historyToggle" onclick="toggleHistorySave()"></div>
        </div>
        <div class="stats-info">
            <p>📥 Total Downloads</p>
            <p class="total-downloads" id="totalDownloadsCount">0</p>
            <p>🎉 Keep going!</p>
        </div>
    </div>
</div>

<!-- custom modals -->
<div id="actionMenuModal" class="custom-modal-overlay">
    <div class="custom-modal action-modal">
        <div class="modal-title">📌 Video Action</div>
        <div class="action-buttons">
            <div class="action-btn delete" id="actionDeleteBtn"><i class="fa-regular fa-trash-can"></i> Delete</div>
            <div class="action-btn share" id="actionShareBtn"><i class="fa-regular fa-share-from-square"></i> Share</div>
        </div>
    </div>
</div>

<div id="confirmDeleteModal" class="custom-modal-overlay">
    <div class="custom-modal">
        <div class="modal-title">⚠️ Confirm</div>
        <div class="modal-message">Are you sure you want to delete this video?</div>
        <div class="confirm-buttons">
            <div class="confirm-btn yes" id="confirmDeleteYes">Yes, Delete</div>
            <div class="confirm-btn no" id="confirmDeleteNo">Cancel</div>
        </div>
    </div>
</div>

<div id="videoPreviewModal" class="custom-modal-overlay video-preview-modal">
    <div class="custom-modal">
        <div style="position:relative">
            <button class="close-modal-btn" id="closePreviewModal">&times;</button>
            <div class="video-preview-container">
                <video id="previewVideo" controls playsinline></video>
            </div>
            <button class="preview-download-btn" id="previewDownloadBtn"><i class="fa-solid fa-download"></i> Download Video</button>
            <button class="preview-close-btn" id="previewCloseBtn">Close</button>
        </div>
    </div>
</div>

<!-- main app -->
<div class="app-container">
    <div class="app-header">
        <div class="brand-title">MY DOWNLOADER</div>
    </div>
    <div class="platform-section">
        <div class="platform-buttons">
            <div class="platform-btn instagram active" onclick="selectPlatform('instagram')">
                <i class="fa-brands fa-square-instagram"></i><span>INSTAGRAM</span>
            </div>
            <div class="platform-btn facebook" onclick="selectPlatform('facebook')">
                <i class="fa-brands fa-square-facebook"></i><span>FACEBOOK</span>
            </div>
        </div>
    </div>
    <div class="input-section">
        <div class="input-area">
            <textarea id="videoLink" placeholder="Paste Instagram Reel or Facebook video link here..."></textarea>
            <div class="clear-input-btn" id="clearInputBtn">✕</div>
            <div class="input-actions">
                <button class="paste-btn" onclick="pasteFromClipboard()">PASTE</button>
            </div>
        </div>
    </div>
    <div class="download-btn-container">
        <button class="main-download-btn" id="mainBtn" onclick="startDownload()">
            <span id="btnText">DOWNLOAD VIDEO</span>
            <i class="fa-solid fa-arrow-down" id="btnIcon"></i>
            <i class="fa-solid fa-circle-notch loader" id="btnLoader"></i>
        </button>
    </div>
    <div class="result-section" id="resultBox">
        <p id="videoTitleDisplay" style="font-size:13px;color:#cbd5e1;margin-bottom:8px;"></p>
        <p style="font-size:14px;color:#22c55e;font-weight:600;margin-bottom:5px;">✅ Video found!</p>
        <button onclick="downloadVideo()" class="success-download-btn" id="galleryBtn">
            ⬇️ Save to Gallery ⬇️
        </button>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-label" id="progressLabel"></p>
    </div>
    <div class="recent-section">
        <div class="recent-header">
            <h3>
                <i class="fa-regular fa-clock"></i> RECENT DOWNLOADS
                <span class="history-count-badge" id="historyCount">0</span>
            </h3>
            <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
        </div>
        <div class="recent-grid" id="recentGrid"></div>
    </div>
</div>

<script>
// ====================== API KEYS — all 14 intact ======================
const API_KEY_A = "58ada1bb8amsh6604490a2fc0596p1fbce5jsn49a52a705e3b";
const API_KEY_B = "19bda3fefdmsh91eea806446b74ap1ea3dbjsne60d3dbce9fa";

let currentPlatform   = 'instagram';
let fetchedVideoUrl   = "";
let fetchedVideoImg   = "";
let currentVideoTitle = "";
let totalDownloads    = 0;
let notificationsEnabled = true;
let historyEnabled    = true;

// ---------- helper functions (toasts, internet, settings, etc) ----------
const ERROR_MESSAGES = {
    NO_INTERNET:    { title:"📵 No Internet Connection!",        msg:"Please turn on WiFi or Mobile Data and try again." },
    INVALID_LINK:   { title:"🔗 Invalid Link!",                  msg:"Please paste a valid Instagram or Facebook link." },
    EMPTY_LINK:     { title:"✏️ Link Empty!",                    msg:"Please paste the video link first." },
    ALL_API_FAILED: { title:"❌ Video Not Found!",               msg:"All servers failed. Is the link correct? Please try again." },
    TIMEOUT:        { title:"⏱️ Request Timed Out!",             msg:"Server did not respond. Slow internet? Try again later." },
    PRIVATE_VIDEO:  { title:"🔒 Private Video",                  msg:"This video is private. Only public videos can be downloaded." },
    DOWNLOAD_FAIL:  { title:"⬇️ Download Failed!",               msg:"Could not download video. Please try again." },
    STORAGE_FULL:   { title:"💾 Storage Full",                   msg:"Device storage is full. Free up space and try again." },
    WRONG_FILE:     { title:"⚠️ Wrong File",                     msg:"Wrong file received. Video opened in new tab — save it from there." },
    UNKNOWN:        { title:"⚠️ Something Went Wrong",           msg:"An unknown error occurred. Please try again." }
};

function showError(type, extra) {
    const msg = ERROR_MESSAGES[type] || ERROR_MESSAGES.UNKNOWN;
    removeAllToasts();
    const t = document.createElement('div'); t.className = 'error-toast';
    t.innerHTML = '<span class="err-title">' + msg.title + '</span>' + msg.msg + (extra ? '<span class="err-sub" style="color:#fbbf24;">'+extra+'</span>' : '');
    document.body.appendChild(t); setTimeout(()=>t.remove(),5000);
}
function showSuccess(msg, sub) {
    removeAllToasts(); const t = document.createElement('div'); t.className='success-toast';
    t.innerHTML = msg + (sub ? '<br><span style="font-size:11px;">'+sub+'</span>' : '');
    document.body.appendChild(t); setTimeout(()=>t.remove(),4000);
}
function showNotification(msg) { if(!notificationsEnabled)return; removeAllToasts(); const t=document.createElement('div'); t.className='notification'; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
function removeAllToasts() { document.querySelectorAll('.error-toast,.success-toast,.notification').forEach(e=>e.remove()); }

function checkInternet() { var off = !navigator.onLine; document.getElementById('noInternetOverlay').classList.toggle('show',off); return !off; }
function retryConnection() { if(navigator.onLine){ document.getElementById('noInternetOverlay').classList.remove('show'); showNotification("✅ Internet connected!"); } else showError('NO_INTERNET'); }
window.addEventListener('online',()=>{ document.getElementById('noInternetOverlay').classList.remove('show'); showNotification("✅ Internet back online!"); });
window.addEventListener('offline',()=>{ document.getElementById('noInternetOverlay').classList.add('show'); });

function loadSettings() {
    try { var s=JSON.parse(localStorage.getItem("downloader_settings")||"{}"); notificationsEnabled=s.notifications!==false; historyEnabled=s.history!==false; totalDownloads=parseInt(localStorage.getItem("total_downloads")||"0"); } catch(e){}
    document.getElementById('notifToggle').classList.toggle('active',notificationsEnabled); document.getElementById('historyToggle').classList.toggle('active',historyEnabled);
    if(document.getElementById('totalDownloadsCount')) document.getElementById('totalDownloadsCount').innerText=totalDownloads;
}
function saveSettings() { localStorage.setItem("downloader_settings",JSON.stringify({notifications:notificationsEnabled, history:historyEnabled})); }

// startDownload
async function startDownload() {
    if (!checkInternet()) { showError('NO_INTERNET'); return; }
    var link = document.getElementById('videoLink').value.trim();
    if (!link) { showError('EMPTY_LINK'); return; }
    if (!isValidUrl(link)) { showError('INVALID_LINK'); return; }
    var btnText = document.getElementById('btnText'), btnIcon = document.getElementById('btnIcon'), btnLoad = document.getElementById('btnLoader'), mainBtn = document.getElementById('mainBtn');
    mainBtn.disabled = true; btnIcon.style.display = "none"; btnLoad.style.display = "inline-block"; btnText.innerText = "Searching...";
    var apis = getApiConfigs(link), videoData = null, allTimeout = true;
    for (var i = 0; i < apis.length; i++) {
        var cfg = apis[i]; btnText.innerText = "API " + (i+1) + "/" + apis.length + "...";
        try { var ctrl = new AbortController(), tid = setTimeout(()=>ctrl.abort(),8000), opts = { method:cfg.method, headers:cfg.headers, signal:ctrl.signal }; if(cfg.method==="POST" && cfg.body) opts.body = cfg.body;
            var resp = await fetch(cfg.url, opts); clearTimeout(tid); allTimeout = false;
            if(resp.ok) { var json = await resp.json(), parsed = cfg.parse(json);
                if(parsed && parsed.url && parsed.url.startsWith("http")) { videoData = parsed; console.log("✅ "+cfg.name); break; }
                if(json && json.error && typeof json.error === 'string' && json.error.toLowerCase().includes("private")) { mainBtn.disabled=false; btnIcon.style.display="inline-block"; btnLoad.style.display="none"; btnText.innerText="DOWNLOAD VIDEO"; showError('PRIVATE_VIDEO'); return; }
            }
        } catch(e) { if(e.name!=='AbortError') allTimeout=false; console.log("❌ "+cfg.name+": "+e.message); }
    }
    mainBtn.disabled = false; btnIcon.style.display = "inline-block"; btnLoad.style.display = "none"; btnText.innerText = "DOWNLOAD VIDEO";
    if(videoData && videoData.url) {
        fetchedVideoUrl = videoData.url; fetchedVideoImg = videoData.img || "";
        var ts = new Date().toISOString().slice(0,19).replace(/:/g,'-');
        currentVideoTitle = currentPlatform.toUpperCase() + "_" + ts;
        document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
        document.getElementById('resultBox').style.display = "block";
        document.getElementById('resultBox').scrollIntoView({behavior:'smooth', block:'center'});
        showSuccess("✅ Video found!", "Now save to Gallery.");
    } else { showError(allTimeout ? 'TIMEOUT' : 'ALL_API_FAILED'); }
}

// downloadVideo (robust)
async function downloadVideo() {
    if (!fetchedVideoUrl) { showError('EMPTY_LINK', "Find video first."); return; }
    if (!checkInternet()) { showError('NO_INTERNET'); return; }
    var btn = document.getElementById('galleryBtn'), pCon = document.getElementById('progressContainer'), pBar = document.getElementById('progressBar'), pLabel = document.getElementById('progressLabel'), fileName = currentVideoTitle + ".mp4";
    btn.disabled = true; btn.innerText = "⏳ Downloading..."; pCon.style.display = "block"; pBar.style.width = "10%"; pLabel.innerText = "Starting...";
    try {
        pBar.style.width = "20%"; pLabel.innerText = "Fetching video...";
        var ctrl = new AbortController(), tid = setTimeout(()=>ctrl.abort(),60000);
        var resp = await fetch(fetchedVideoUrl, { signal:ctrl.signal, mode:'cors', headers:{'Accept':'video/mp4,video/*,*/*'} }); clearTimeout(tid);
        if(!resp.ok) throw new Error("HTTP_"+resp.status);
        var ct = resp.headers.get('Content-Type')||''; if(ct.includes('text/html')||ct.includes('text/plain')) throw new Error("HTML_RESPONSE");
        pBar.style.width = "40%"; pLabel.innerText = "Downloading...";
        var contentLength = resp.headers.get('Content-Length'), blob;
        if(contentLength) { var total = parseInt(contentLength), reader = resp.body.getReader(), chunks = [], received = 0;
            while(true) { var res = await reader.read(); if(res.done) break; chunks.push(res.value); received += res.value.length; var pct = 40 + Math.round((received / total) * 45); pBar.style.width = pct + "%"; pLabel.innerText = (received/1024/1024).toFixed(1) + " MB / " + (total/1024/1024).toFixed(1) + " MB"; }
            blob = new Blob(chunks, { type: 'video/mp4' });
        } else { blob = await resp.blob(); }
        if(blob.size < 5000) throw new Error("BLOB_TOO_SMALL");
        if(blob.type && blob.type.includes('text/html')) throw new Error("HTML_BLOB");
        pBar.style.width = "90%"; pLabel.innerText = "Saving to Gallery...";
        var videoBlob = new Blob([blob], { type: 'video/mp4' }), blobUrl = URL.createObjectURL(videoBlob);
        var a = document.createElement('a'); a.href = blobUrl; a.download = fileName; a.style.display = 'none'; document.body.appendChild(a); a.click();
        setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }catch(x){} }, 10000);
        pBar.style.width = "100%"; pLabel.innerText = "✅ Saved to Gallery!"; btn.innerText = "✅ Saved to Gallery!";
        showSuccess("✅ " + fileName + " saved to Gallery!", "Check your Downloads / Gallery folder.");
        incrementDownloadCount(); saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
    } catch(err) {
        console.warn(err);
        if(err.message === 'STORAGE_FULL') showError('STORAGE_FULL');
        else if(err.name === 'AbortError') showError('TIMEOUT');
        else { try { pBar.style.width = "70%"; pLabel.innerText = "Trying direct download...";
            var a2 = document.createElement('a'); a2.href = fetchedVideoUrl; a2.download = fileName; a2.style.display = 'none'; a2.rel = 'noopener noreferrer'; document.body.appendChild(a2); a2.click();
            setTimeout(()=>{ try{ document.body.removeChild(a2); }catch(x){} }, 1000);
            pBar.style.width = "100%"; pLabel.innerText = "✅ Download started! Check Downloads."; btn.innerText = "✅ Download started!";
            showSuccess("✅ Video download started!", "Check Files app → Downloads.");
            incrementDownloadCount(); saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
        } catch(err2) { try { window.open(fetchedVideoUrl, '_blank'); pBar.style.width = "100%"; btn.innerText = "↗️ Opened in new tab — save from there"; showError('WRONG_FILE'); } catch(err3) { showError('DOWNLOAD_FAIL', err3.message); } } }
    }
    setTimeout(()=>{ pCon.style.display = "none"; pBar.style.width = "0%"; if(pLabel) pLabel.innerText = ""; btn.disabled = false; btn.innerText = "⬇️ Save to Gallery ⬇️"; }, 4000);
}

// ---------- HISTORY with new modals ----------
let pendingDeleteIndex = null;
let pendingShareItem = null;
let currentVideoItemForPreview = null;

function saveToHistory(name, url, img) {
    if(!historyEnabled) return;
    try { let h = JSON.parse(localStorage.getItem("downloader_history")||"[]"); if(!h.some(x=>x.url===url)){ h.unshift({name,url,img,platform:currentPlatform,date:new Date().toISOString()}); if(h.length>20) h.pop(); localStorage.setItem("downloader_history",JSON.stringify(h)); loadHistory(); } } catch(e){}
}
function deleteHistoryItem(index) { try { let h=JSON.parse(localStorage.getItem("downloader_history")||"[]"); h.splice(index,1); localStorage.setItem("downloader_history",JSON.stringify(h)); loadHistory(); showNotification("🗑️ Deleted"); } catch(e){} }

function showActionMenu(index, item) {
    pendingDeleteIndex = index; pendingShareItem = item;
    let modal = document.getElementById('actionMenuModal');
    modal.classList.add('show');
    document.getElementById('actionDeleteBtn').onclick = () => {
        modal.classList.remove('show');
        let confirmModal = document.getElementById('confirmDeleteModal');
        confirmModal.classList.add('show');
        document.getElementById('confirmDeleteYes').onclick = () => {
            deleteHistoryItem(index);
            confirmModal.classList.remove('show');
        };
        document.getElementById('confirmDeleteNo').onclick = () => confirmModal.classList.remove('show');
    };
    document.getElementById('actionShareBtn').onclick = () => {
        modal.classList.remove('show');
        if(navigator.share) {
            navigator.share({ title: item.name, url: item.url }).catch(()=>showNotification("Share cancelled"));
        } else {
            navigator.clipboard.writeText(item.url).then(()=>showNotification("✅ Video link copied!")).catch(()=>showError('UNKNOWN'));
        }
    };
}

function showVideoPreview(item) {
    currentVideoItemForPreview = item;
    let modal = document.getElementById('videoPreviewModal');
    let video = document.getElementById('previewVideo');
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.src = item.url;
    video.load();
    modal.classList.add('show');
    document.getElementById('closePreviewModal').onclick = () => { modal.classList.remove('show'); video.pause(); };
    document.getElementById('previewCloseBtn').onclick = () => { modal.classList.remove('show'); video.pause(); };
    document.getElementById('previewDownloadBtn').onclick = () => {
        fetchedVideoUrl = item.url;
        currentVideoTitle = item.name;
        fetchedVideoImg = item.img || "";
        downloadVideo();
        modal.classList.remove('show');
        video.pause();
    };
}

function loadHistory() {
    var grid = document.getElementById("recentGrid"); grid.innerHTML = "";
    var hist = []; try { hist = JSON.parse(localStorage.getItem("downloader_history")||"[]"); } catch(e){}
    updateHistoryCount();
    if(hist.length===0) { grid.innerHTML = '<p style="grid-column:span 4;text-align:center;color:#64748b;padding:20px;">No videos yet<br>No downloads yet</p>'; return; }
    hist.forEach((item, idx) => {
        var div = document.createElement("div"); div.className = "recent-item";
        if(item.img && item.img.startsWith("http")) { div.innerHTML = `<img class="thumb-img" src="${item.img}" onerror="this.style.display='none'" alt="thumb" loading="lazy"><div class="play-badge"><i class="fa-solid fa-play"></i></div><div class="thumb-label">${item.name.substring(0,12)}</div>`; }
        else { div.innerHTML = `<i class="fa-solid fa-video no-thumb-icon"></i><span class="no-thumb-label">${item.name.substring(0,12)}</span>`; }
        let pressTimer = null, isLongPress = false;
        div.addEventListener('touchstart', (e) => { isLongPress=false; pressTimer=setTimeout(()=>{ isLongPress=true; showActionMenu(idx, item); },600); }, {passive:true});
        div.addEventListener('touchend', () => { clearTimeout(pressTimer); if(!isLongPress) showVideoPreview(item); isLongPress=false; });
        div.addEventListener('touchmove', () => { clearTimeout(pressTimer); });
        div.addEventListener('contextmenu', (e) => { e.preventDefault(); showActionMenu(idx, item); });
        div.addEventListener('click', (e) => { if(!isLongPress) showVideoPreview(item); isLongPress=false; });
        grid.appendChild(div);
    });
}
function clearHistory() { if(confirm("Clear all history?")) { localStorage.removeItem("downloader_history"); loadHistory(); showNotification("✅ History cleared"); } }

// Clear input button
document.getElementById('clearInputBtn').addEventListener('click', () => {
    document.getElementById('videoLink').value = '';
    document.getElementById('videoLink').focus();
    showNotification("✏️ Text cleared");
});

// PWA
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').then(r=>console.log('SW:',r.scope)).catch(e=>console.warn(e)); }); }

// INIT
loadSettings(); loadHistory(); setTimeout(checkInternet,500);
