<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>My Downloader - Web Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0f1626 0%, #070a12 100%);
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 25px;
        }

        .platform-section {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .platform-buttons {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }

        .platform-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .platform-btn.instagram i {
            background: linear-gradient(45deg, #f97316, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 38px;
        }

        .platform-btn.facebook i { color: #3b82f6; font-size: 38px; }

        .platform-btn span {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .platform-btn.active.instagram {
            border-color: #ec4899;
            background: rgba(236, 72, 153, 0.05);
        }
        .platform-btn.active.instagram span { color: #ffffff; }

        .platform-btn.active.facebook {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        .platform-btn.active.facebook span { color: #ffffff; }

        .input-section {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-area {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 12px;
        }

        .input-area textarea {
            width: 100%;
            height: 60px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            resize: none;
        }

        .input-area textarea::placeholder { color: #64748b; }

        .input-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .paste-btn {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
            border: none;
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .main-download-btn {
            width: 100%;
            background: linear-gradient(90deg, #0284c7 0%, #0ea5e9 100%);
            border: none;
            border-radius: 50px;
            padding: 18px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .result-section {
            display: none;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #22c55e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-download-btn {
            width: 100%;
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .progress-container {
            display: none;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            transition: width 0.3s ease;
        }

        .recent-section { flex-grow: 1; margin-bottom: 20px; }
        .recent-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .recent-header h3 { font-size: 14px; color: #94a3b8; }
        .clear-history-btn { font-size: 12px; color: #ef4444; cursor: pointer; background: none; border: none; }

        .recent-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 240px;
            overflow-y: auto;
        }

        .recent-item {
            position: relative;
            aspect-ratio: 1 / 1;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            overflow: hidden;
        }

        .recent-item i { font-size: 20px; color: #94a3b8; }
        .recent-item span {
            font-size: 9px;
            color: white;
            margin-top: 5px;
            text-align: center;
            padding: 3px;
        }

        .loader { display: none; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .no-internet-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .no-internet-overlay.show { display: flex; }

        .no-internet-box {
            background: #0f1e36;
            border: 1px solid #ef4444;
            border-radius: 24px;
            padding: 32px;
            text-align: center;
        }

        .no-internet-retry-btn {
            background: #ef4444;
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="no-internet-overlay" id="noInternetOverlay">
        <div class="no-internet-box">
            <i class="fa-solid fa-wifi" style="font-size: 48px; color: #ef4444;"></i>
            <h3 style="margin-top: 16px;">इंटरनेट नहीं है!</h3>
            <button class="no-internet-retry-btn" onclick="retryConnection()">दोबारा कोशिश करें</button>
        </div>
    </div>

    <div class="app-container">
        <div class="brand-title">MY DOWNLOADER</div>

        <div class="platform-section">
            <div class="platform-buttons">
                <div class="platform-btn instagram active" onclick="selectPlatform('instagram')">
                    <i class="fa-brands fa-square-instagram"></i>
                    <span>INSTAGRAM</span>
                </div>
                <div class="platform-btn facebook" onclick="selectPlatform('facebook')">
                    <i class="fa-brands fa-square-facebook"></i>
                    <span>FACEBOOK</span>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-area">
                <textarea id="videoLink" placeholder="यहाँ इंस्टाग्राम/फेसबुक वीडियो का लिंक पेस्ट करें..."></textarea>
                <div class="input-actions">
                    <button class="paste-btn" onclick="pasteFromClipboard()">PASTE</button>
                </div>
            </div>
        </div>

        <button class="main-download-btn" onclick="startDownload()">
            <span id="btnText">DOWNLOAD VIDEO</span>
            <i class="fa-solid fa-arrow-down" id="btnIcon"></i>
            <i class="fa-solid fa-circle-notch loader" id="btnLoader"></i>
        </button>

        <div class="result-section" id="resultBox">
            <p id="videoTitleDisplay" style="font-size: 13px; color: #cbd5e1;"></p>
            <button onclick="downloadVideo()" class="success-download-btn" id="galleryBtn">⬇️ वीडियो डाउनलोड करें ⬇️</button>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <div class="recent-section">
            <div class="recent-header">
                <h3>RECENT DOWNLOADS</h3>
                <button class="clear-history-btn" onclick="clearHistory()">Clear All</button>
            </div>
            <div class="recent-grid" id="recentGrid"></div>
        </div>
    </div>

    <script>
        // ========== ⚠️ कोई cordova.js नहीं! Pure Web-Only ==========
        
        // API Keys
        const API_KEY_A = "58ada1bb8amsh6604490a2fc0596p1fbce5jsn49a52a705e3b";
        const API_KEY_B = "19bda3fefdmsh91eea806446b74ap1ea3dbjsne60d3dbce9fa";

        let currentPlatform = 'instagram';
        let fetchedVideoUrl = "";
        let currentVideoTitle = "";

        // ========== INTERNET CHECK (Browser API) ==========
        function checkInternet() {
            if (!navigator.onLine) {
                document.getElementById('noInternetOverlay').classList.add('show');
                return false;
            }
            document.getElementById('noInternetOverlay').classList.remove('show');
            return true;
        }

        function retryConnection() {
            if (navigator.onLine) {
                document.getElementById('noInternetOverlay').classList.remove('show');
            } else {
                alert("अभी भी इंटरनेट कनेक्ट नहीं है।");
            }
        }

        window.addEventListener('online', () => document.getElementById('noInternetOverlay').classList.remove('show'));
        window.addEventListener('offline', () => document.getElementById('noInternetOverlay').classList.add('show'));

        // ========== CLIPBOARD (Pure Web API - No Cordova) ==========
        async function pasteFromClipboard() {
            try {
                // नया Clipboard API - सिर्फ HTTPS पर काम करता है
                const text = await navigator.clipboard.readText();
                document.getElementById('videoLink').value = text.trim();
                if (text.includes("facebook.com")) selectPlatform('facebook');
                showNotification("✅ लिंक पेस्ट हो गया!");
            } catch(e) {
                // Fallback: manual paste
                const manual = prompt("लिंक यहाँ डालें:");
                if (manual) document.getElementById('videoLink').value = manual.trim();
            }
        }

        function selectPlatform(platform) {
            currentPlatform = platform;
            document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.platform-btn.${platform}`).classList.add('active');
            document.getElementById('videoLink').value = "";
            document.getElementById('resultBox').style.display = 'none';
            fetchedVideoUrl = "";
        }

        function isValidUrl(text) {
            return text.includes("instagram.com") || text.includes("facebook.com") || text.includes("fb.watch");
        }

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        // ========== API CONFIGS (सिर्फ 4 तेज़ APIs) ==========
        function getApiConfigs(link) {
            return [
                {
                    name: "Snap Video",
                    url: "https://snap-video3.p.rapidapi.com/download",
                    method: "POST",
                    headers: {
                        "x-rapidapi-host": "snap-video3.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A,
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: 'url=' + encodeURIComponent(link),
                    parse: (res) => {
                        if (res && res.medias && res.medias.length > 0) {
                            const best = res.medias.find(m => m.videoAvailable && m.audioAvailable) || res.medias[0];
                            return { url: best.url, title: res.title || "Snap_Video", img: res.thumbnail || "" };
                        }
                        return null;
                    }
                },
                {
                    name: "All In One",
                    url: `https://all-in-one-media-downloader-api.p.rapidapi.com/download?url=${encodeURIComponent(link)}`,
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "all-in-one-media-downloader-api.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A
                    },
                    body: null,
                    parse: (res) => {
                        if (res && res.url) return { url: res.url, title: res.title || "Media_Video", img: res.thumbnail || "" };
                        return null;
                    }
                },
                {
                    name: "Universal Downloader",
                    url: `https://universal-social-media-content-downloader-api.p.rapidapi.com/platforms?url=${encodeURIComponent(link)}`,
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "universal-social-media-content-downloader-api.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A
                    },
                    body: null,
                    parse: (res) => {
                        if (res && res.url) return { url: res.url, title: res.title || "Universal_Video", img: res.thumbnail || "" };
                        return null;
                    }
                },
                {
                    name: "Full Downloader",
                    url: `https://full-downloader-social-media.p.rapidapi.com/?url=${encodeURIComponent(link)}`,
                    method: "GET",
                    headers: {
                        "x-rapidapi-host": "full-downloader-social-media.p.rapidapi.com",
                        "x-rapidapi-key": API_KEY_A
                    },
                    body: null,
                    parse: (res) => {
                        if (res && res.url) return { url: res.url, title: res.title || "Social_Video", img: res.thumbnail || "" };
                        return null;
                    }
                }
            ];
        }

        // ========== MAIN DOWNLOAD FUNCTION ==========
        async function startDownload() {
            if (!checkInternet()) return;

            const link = document.getElementById('videoLink').value.trim();
            if (!link) {
                alert("कृपया लिंक डालें!");
                return;
            }
            if (!isValidUrl(link)) {
                alert("कृपया सही Instagram या Facebook लिंक डालें!");
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.querySelector('.main-download-btn');

            mainBtn.disabled = true;
            btnIcon.style.display = "none";
            btnLoader.style.display = "inline-block";
            btnText.innerText = "वीडियो ढूंढ रहा है...";

            const apiConfigs = getApiConfigs(link);
            let videoData = null;

            // Sequential API calls (ek ke baad ek)
            for (let i = 0; i < apiConfigs.length; i++) {
                const config = apiConfigs[i];
                btnText.innerText = `API ${i+1}/${apiConfigs.length} चल रही है...`;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    const fetchOptions = {
                        method: config.method,
                        headers: config.headers,
                        signal: controller.signal
                    };
                    if (config.method === "POST" && config.body) {
                        fetchOptions.body = config.body;
                    }

                    const response = await fetch(config.url, fetchOptions);
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        const parsed = config.parse(result);
                        if (parsed && parsed.url && parsed.url.startsWith("http")) {
                            videoData = parsed;
                            console.log(`✅ ${config.name} success!`);
                            break;
                        }
                    }
                } catch(e) {
                    console.log(`❌ ${config.name} failed: ${e.message}`);
                }
            }

            mainBtn.disabled = false;
            btnIcon.style.display = "inline-block";
            btnLoader.style.display = "none";
            btnText.innerText = "DOWNLOAD VIDEO";

            if (videoData && videoData.url) {
                fetchedVideoUrl = videoData.url;
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                currentVideoTitle = `${currentPlatform.toUpperCase()}_${timestamp}`;
                document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                document.getElementById('resultBox').style.display = "block";
                showNotification("✅ वीडियो मिल गया! अब डाउनलोड करें");
            } else {
                alert("❌ वीडियो नहीं मिला। लिंक चेक करें या बाद में कोशिश करें।");
            }
        }

        // ========== ✅ PURE WEB DOWNLOAD - कोई native code नहीं! ==========
        async function downloadVideo() {
            if (!fetchedVideoUrl) {
                alert("पहले वीडियो ढूंढें!");
                return;
            }

            const galleryBtn = document.getElementById('galleryBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            galleryBtn.disabled = true;
            galleryBtn.innerText = "⏳ डाउनलोड हो रहा है...";
            progressContainer.style.display = "block";
            progressBar.style.width = "20%";

            try {
                // Method 1: Fetch + Blob (सबसे अच्छा तरीका)
                progressBar.style.width = "50%";
                const response = await fetch(fetchedVideoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                progressBar.style.width = "80%";
                
                // ✅ Pure HTML5 <a> tag with download attribute
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 100);
                
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ डाउनलोड हो गया!";
                showNotification(`✅ ${currentVideoTitle}.mp4 डाउनलोड शुरू!`);
                saveToHistory(currentVideoTitle, fetchedVideoUrl, "");
                
            } catch(error) {
                console.log("Blob download failed, trying direct link:", error);
                
                // Method 2: Direct link (fallback)
                progressBar.style.width = "80%";
                const a = document.createElement('a');
                a.href = fetchedVideoUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.target = "_blank";
                a.click();
                
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ डाउनलोड शुरू!";
                showNotification(`✅ डाउनलोड शुरू हो गया है!`);
                saveToHistory(currentVideoTitle, fetchedVideoUrl, "");
            }

            setTimeout(() => {
                progressContainer.style.display = "none";
                galleryBtn.disabled = false;
                galleryBtn.innerText = "⬇️ वीडियो डाउनलोड करें ⬇️";
            }, 3000);
        }

        // ========== HISTORY (LocalStorage - Pure Web) ==========
        function saveToHistory(name, url, img) {
            try {
                let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
                if (!history.some(h => h.url === url)) {
                    history.unshift({ name, url, img, platform: currentPlatform });
                    if (history.length > 20) history.pop();
                    localStorage.setItem("downloader_history", JSON.stringify(history));
                    loadHistory();
                }
            } catch(e) {}
        }

        function loadHistory() {
            const grid = document.getElementById("recentGrid");
            grid.innerHTML = "";
            let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
            
            if (history.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 4; text-align: center; color: #64748b; padding: 20px;">कोई वीडियो नहीं</p>`;
                return;
            }
            
            history.forEach(item => {
                const div = document.createElement("div");
                div.className = "recent-item";
                div.onclick = () => {
                    // सिर्फ वीडियो URL खोले, app redirect नहीं
                    window.open(item.url, '_blank');
                };
                div.innerHTML = `<i class="fa-solid fa-video"></i><span>${item.name.substring(0, 12)}</span>`;
                grid.appendChild(div);
            });
        }

        function clearHistory() {
            if (confirm("हिस्ट्री डिलीट करें?")) {
                localStorage.removeItem("downloader_history");
                loadHistory();
            }
        }

        // Page Load par
        loadHistory();
        setTimeout(checkInternet, 500);
    </script>
</body>
</html>
