            document.getElementById('noInternetOverlay').classList.remove('show');
            return true;
        }

            if (navigator.onLine) {
                document.getElementById('noInternetOverlay').classList.remove('show');
            } else {
                alert("Still no internet. Please turn on Wi-Fi or Mobile Data.");
            }
        }

                showNotification("✅ Link pasted!");

                if (manual) document.getElementById('videoLink').value = manual.trim();

            document.getElementById('resultBox').style.display = 'none';

            const link = document.getElementById('videoLink').value.trim();
            if (!link) {
                alert("Please paste a video link first!");
                return;
            }
            if (!isValidUrl(link)) {
                alert("Please enter a valid Instagram or Facebook video link.");
                return;
            }

            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnLoader = document.getElementById('btnLoader');
            const mainBtn = document.getElementById('mainBtn');

            mainBtn.disabled = true;
            btnIcon.style.display = "none";
            btnLoader.style.display = "inline-block";
            btnText.innerText = "Searching video...";

            const apiConfigs = getApiConfigs(link);
            let videoData = null;

            for (let i = 0; i < apiConfigs.length; i++) {
                const config = apiConfigs[i];
                btnText.innerText = `Trying API ${i+1}/${apiConfigs.length}...`;

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);

                    const fetchOptions = {
                        method: config.method,
                        headers: config.headers,
                        signal: controller.signal
                    };
                    if (config.method === "POST" && config.body) {
                        fetchOptions.body = config.body;
                    }

                    const response = await fetch(config.url, fetchOptions);
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const result = await response.json();
                        const parsed = config.parse(result);
                        if (parsed && parsed.url && parsed.url.startsWith("http")) {
                            videoData = parsed;
                            console.log(`✅ ${config.name} success!`);
                            break;
                        }
                    }
                } catch(e) {
                    console.log(`❌ ${config.name} failed: ${e.message}`);
                }
            }

            mainBtn.disabled = false;
            btnIcon.style.display = "inline-block";
            btnLoader.style.display = "none";
            btnText.innerText = "DOWNLOAD VIDEO";

            if (videoData && videoData.url) {
                fetchedVideoUrl = videoData.url;
                fetchedVideoImg = videoData.img || "";
                const timestamp = new Date().toISOString().slice(0,19).replace(/:/g, '-');
                currentVideoTitle = `${currentPlatform.toUpperCase()}_${timestamp}`;
                document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                document.getElementById('resultBox').style.display = "block";
                showNotification("✅ Video found! Click Save to download.");
            } else {
                alert("❌ All APIs failed. Please check the link or try again later.");
            }
        }

        // ========== PURE WEB DOWNLOAD (No Redirect) ==========
        async function downloadVideo() {
            if (!fetchedVideoUrl) {
                alert("Please fetch a video first!");
                return;
            }

            const galleryBtn = document.getElementById('galleryBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            galleryBtn.disabled = true;
            galleryBtn.innerText = "⏳ Downloading...";
            progressContainer.style.display = "block";
            progressBar.style.width = "20%";

            try {
                progressBar.style.width = "50%";
                const response = await fetch(fetchedVideoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                progressBar.style.width = "80%";
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 100);
                
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ Downloaded!";
                showNotification(`✅ ${currentVideoTitle}.mp4 saved!`);
                saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
                
            } catch(error) {
                console.log("Blob failed, using direct link:", error);
                progressBar.style.width = "80%";
                const a = document.createElement('a');
                a.href = fetchedVideoUrl;
                a.download = `${currentVideoTitle}.mp4`;
                a.target = "_blank";
                a.click();
                progressBar.style.width = "100%";
                galleryBtn.innerText = "✅ Download started!";
                showNotification(`✅ Download started!`);
                saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
            }

            setTimeout(() => {
                progressContainer.style.display = "none";
                galleryBtn.disabled = false;
                galleryBtn.innerText = "⬇️ SAVE VIDEO ⬇️";
            }, 3000);
        }

        // ========== HISTORY (No Clear Button) ==========
        function saveToHistory(name, url, img) {
            try {
                let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
                if (!history.some(h => h.url === url)) {
                    history.unshift({ name, url, img, platform: currentPlatform, date: new Date().toISOString() });
                    if (history.length > 20) history.pop();
                    localStorage.setItem("downloader_history", JSON.stringify(history));
                    loadHistory();
                }
            } catch(e) {}
        }

        function loadHistory() {
            const grid = document.getElementById("recentGrid");
            grid.innerHTML = "";
            let history = JSON.parse(localStorage.getItem("downloader_history") || "[]");
            
            if (history.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 4; text-align: center; color: #64748b; padding: 20px;">No videos yet</p>`;
                return;
            }
            
            history.forEach(item => {
                const div = document.createElement("div");
                div.className = "recent-item";
                div.onclick = () => {
                    // Re-download old video
                    fetchedVideoUrl = item.url;
                    currentVideoTitle = item.name;
                    document.getElementById('videoTitleDisplay').innerText = currentVideoTitle;
                    document.getElementById('resultBox').style.display = "block";
                    showNotification("✅ Video loaded! Click Save to download.");
                };
                div.innerHTML = `<i class="fa-solid fa-video"></i><span>${item.name.substring(0, 12)}</span>`;
                grid.appendChild(div);
            });
        }

        // ========== PWA SERVICE WORKER ==========
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker registered:', reg);
                }).catch(err => {
                    console.log('Service Worker registration failed:', err);
                });
            });
        }

        // ========== INIT ==========
        loadHistory();
        setTimeout(checkInternet, 500);
    </script>
</body>
</html>
