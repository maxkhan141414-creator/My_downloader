<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050d1a">
    <title>Video Downloader &amp; My Story Saver</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ══════════════════════════════════════════
           RESET & BASE
        ══════════════════════════════════════════ */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:#050d1a; color:#fff; min-height:100vh; display:flex; justify-content:center; overflow-x:hidden; }

        .app-wrapper {
            width:100%; max-width:430px; min-height:100vh;
            background:#070f1e; display:flex; flex-direction:column;
            padding-bottom:62px; /* space for bottom nav */
        }

        /* ══════════════════════════════════════════
           TOP HEADER  (three-dots removed)
        ══════════════════════════════════════════ */
        .top-header {
            display:flex; align-items:center;
            padding:11px 14px 10px; background:#070f1e; gap:10px;
            border-bottom:1px solid rgba(56,189,248,0.07);
            position:sticky; top:0; z-index:100;
        }
        .app-logo-img { width:44px; height:44px; border-radius:12px; object-fit:cover; flex-shrink:0; }
        .app-name-block { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
        .app-name-main { font-size:13px; font-weight:800; color:#fff; line-height:1.3; word-break:break-word; display:block; }
        .app-name-sub  { font-size:10px; font-weight:500; color:#7dd3fc; display:block; margin-top:1px; }
        /* Header icons — no three-dots, just VIP + IG */
        .header-icons  { display:flex; align-items:center; gap:8px; flex-shrink:0; margin-left:auto; }

        .btn-gift { width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:20px; background:transparent; padding:0; }
        .btn-vip  { display:flex; align-items:center; cursor:pointer; border:none; background:none; padding:0; }
        .vip-shape { background:linear-gradient(145deg,#1a6fd4,#2389f5,#1557b0); border-radius:20px; padding:6px 12px 6px 8px; display:flex; align-items:center; gap:5px; box-shadow:0 2px 8px rgba(33,137,245,0.5),inset 0 1px 0 rgba(255,255,255,0.25),inset 0 -1px 0 rgba(0,0,0,0.2); }
        .vip-ad-pill { background:linear-gradient(135deg,#ff3333,#cc0000); border-radius:5px; padding:2px 5px; font-size:9px; font-weight:900; color:#fff; letter-spacing:0.3px; }
        .vip-text    { font-size:13px; font-weight:900; color:#fff; letter-spacing:0.5px; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
        .btn-ig { width:36px; height:36px; border-radius:10px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; background:linear-gradient(135deg,#feda77 0%,#f58529 25%,#dd2a7b 50%,#8134af 75%,#515bd4 100%); box-shadow:0 2px 8px rgba(221,42,123,0.45); position:relative; overflow:hidden; }
        .btn-ig::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent); border-radius:10px; }
        .btn-ig i { font-size:20px; color:#fff; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3)); position:relative; z-index:1; }

        /* ══════════════════════════════════════════
           SCROLLABLE CONTENT
        ══════════════════════════════════════════ */
        .scroll-content { flex:1; overflow-y:auto; padding:12px 14px 0; }

        /* ══════════════════════════════════════════
           PLATFORM BUTTONS
        ══════════════════════════════════════════ */
        .platform-section { margin-bottom:12px; }
        .platform-row { display:flex; gap:10px; }
        .platform-btn { flex:1; padding:10px 8px; border-radius:14px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; transition:all 0.2s; background:#0d1b2e; border:2px solid transparent; }
        .platform-btn.instagram.active { border-color:#e91e8c; box-shadow:0 0 16px rgba(233,30,140,0.3); }
        .platform-btn.facebook.active  { border-color:#1877f2; box-shadow:0 0 16px rgba(24,119,242,0.3); }
        .platform-btn .p-icon-wrap { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .platform-btn.instagram .p-icon-wrap i { background:linear-gradient(45deg,#f97316,#ec4899,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .platform-btn.facebook  .p-icon-wrap i { color:#1877f2; }
        .platform-btn span { font-size:11px; font-weight:800; letter-spacing:0.8px; color:#94a3b8; }
        .platform-btn.active span { color:#fff; }

        /* ══════════════════════════════════════════
           INPUT BOX
        ══════════════════════════════════════════ */
        .input-section { margin-bottom:12px; }
        .input-box { background:#0d1b2e; border:1.5px solid rgba(56,189,248,0.2); border-radius:16px; padding:13px 13px 10px; }
        .input-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
        .input-row input { flex:1; background:transparent; border:none; outline:none; color:#94a3b8; font-size:14px; min-width:0; }
        .input-row input::placeholder { color:#3d5070; }
        .input-row input:focus { color:#fff; }
        .paste-row { display:flex; justify-content:flex-end; align-items:center; height:36px; position:relative; }
        .paste-btn, .clear-x-btn { transition:opacity 0.2s ease, transform 0.2s ease, visibility 0.2s; }
        .paste-btn { background:linear-gradient(135deg,#1d4ed8,#3b82f6); border:none; color:#fff; padding:8px 22px; border-radius:30px; font-size:12px; font-weight:700; letter-spacing:1px; cursor:pointer; box-shadow:0 3px 10px rgba(59,130,246,0.40); min-height:34px; display:inline-flex; align-items:center; justify-content:center; }
        .clear-x-btn { width:34px; height:34px; background:rgba(239,68,68,0.12); border:1.5px solid rgba(239,68,68,0.5); border-radius:40px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#ef4444; font-size:16px; font-weight:600; transition:all 0.2s ease; }
        .clear-x-btn:active { background:rgba(239,68,68,0.35); transform:scale(0.92); }
        .paste-btn.hide-paste   { opacity:0; visibility:hidden; transform:scale(0.85); pointer-events:none; position:absolute; right:0; }
        .clear-x-btn.hide-clear { opacity:0; visibility:hidden; transform:scale(0.85); pointer-events:none; position:absolute; right:0; }

        /* ══════════════════════════════════════════
           DOWNLOAD BUTTON
        ══════════════════════════════════════════ */
        .download-section { margin-bottom:12px; }
        .download-btn { width:100%; padding:17px; background:linear-gradient(90deg,#00b4ff,#0088ff,#0055ff); border:none; border-radius:50px; color:#fff; font-size:16px; font-weight:800; letter-spacing:0.8px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 0 28px rgba(0,136,255,0.45); transition:all 0.2s; position:relative; overflow:hidden; }
        .download-btn::before { content:''; position:absolute; top:0; left:0; right:0; height:50%; background:rgba(255,255,255,0.1); border-radius:50px 50px 0 0; }
        .download-btn:active   { transform:scale(0.98); }
        .download-btn:disabled { opacity:0.6; cursor:not-allowed; }
        .loader { display:none; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

        /* ══════════════════════════════════════════
           PREVIEW BOX
        ══════════════════════════════════════════ */
        .preview-section { margin-bottom:12px; }
        .preview-box { background:#0d1b2e; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.05); }

        /* Idle placeholder */
        #previewPlaceholder { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:36px; gap:10px; min-height:180px; }
        .film-icon-wrap { width:72px; height:72px; background:rgba(56,189,248,0.08); border-radius:14px; display:flex; align-items:center; justify-content:center; }
        .film-icon-wrap i { font-size:34px; color:rgba(56,189,248,0.4); }
        .loading-text { font-size:13px; color:#3d5070; font-weight:500; text-align:center; }

        /* Result state */
        #resultContent { display:none; flex-direction:column; width:100%; }

        /* Thumbnail */
        #thumbWrapper { width:100%; height:215px; background:linear-gradient(135deg,#0a1828,#0d2245); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
        #thumbPreviewImg { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:none; }
        #thumbFallbackIcon { font-size:54px; color:rgba(56,189,248,0.18); display:none; }

        /* Top-left overlay: platform icon + size
           FIX: "-- MB" removed — now shows just the size value or nothing until download */
        .thumb-overlay-tl {
            position:absolute; top:10px; left:10px; display:none;
            align-items:center; gap:6px;
            background:rgba(0,0,0,0.62); border-radius:20px;
            padding:4px 10px 4px 7px; backdrop-filter:blur(4px); z-index:10;
        }
        .thumb-overlay-tl i { font-size:15px; }
        /* Size text — only rendered after download; hidden by default */
        .size-text { font-size:11px; font-weight:700; color:#fff; letter-spacing:0.3px; display:none; }

        /* Top-right overlay: reel/clapperboard icon */
        .thumb-overlay-tr { position:absolute; top:10px; right:10px; display:none; background:rgba(0,0,0,0.62); border-radius:8px; padding:5px 7px; backdrop-filter:blur(4px); z-index:10; }
        .thumb-overlay-tr i { font-size:16px; color:#fff; }

        /* Info strip below thumbnail */
        .result-info { padding:12px 14px 14px; position:relative; }
        .result-title  { font-size:11px; color:#64748b; margin-bottom:3px; word-break:break-all; }
        .result-status { font-size:13px; color:#22c55e; font-weight:700; margin-bottom:12px; }

        /* ── SHARE BUTTON (top-right of result-info, above Save button) ──
           Positioned absolute inside .result-info */
        .share-fab {
            position:absolute;
            top:10px; right:14px;
            width:38px; height:38px;
            background:linear-gradient(135deg,#1d4ed8,#3b82f6);
            border:none; border-radius:50%;
            display:none; /* shown after fetch */
            align-items:center; justify-content:center;
            cursor:pointer;
            box-shadow:0 4px 14px rgba(59,130,246,0.45);
            color:#fff; font-size:16px;
            transition:transform 0.15s, box-shadow 0.15s;
            z-index:5;
        }
        .share-fab:active { transform:scale(0.9); box-shadow:0 2px 8px rgba(59,130,246,0.3); }

        .save-btn { width:100%; background:linear-gradient(90deg,#22c55e,#16a34a); border:none; color:#fff; padding:13px; border-radius:22px; font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 4px 14px rgba(34,197,94,0.28); }
        .progress-container { display:none; width:100%; background:rgba(255,255,255,0.08); border-radius:10px; margin-top:10px; overflow:hidden; }
        .progress-bar  { width:0%; height:6px; background:linear-gradient(90deg,#22c55e,#3b82f6); transition:width 0.4s ease; }
        .progress-label{ font-size:11px; color:#64748b; margin-top:5px; text-align:center; }

        /* Bottom action bar inside result card */
        .thumb-action-bar { display:none; justify-content:space-around; align-items:center; background:#0a1628; border-top:1px solid rgba(56,189,248,0.08); padding:10px 8px; }
        .action-btn { display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; background:none; border:none; color:#94a3b8; flex:1; transition:color 0.2s; }
        .action-btn i    { font-size:21px; }
        .action-btn span { font-size:10px; font-weight:600; letter-spacing:0.3px; }
        .action-btn:active { color:#fff; }

        /* ══════════════════════════════════════════
           VIP BANNER
        ══════════════════════════════════════════ */
        .vip-banner { background:linear-gradient(135deg,#0d1b2e,#0a1525); border:1px solid rgba(56,189,248,0.15); border-radius:16px; padding:14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; cursor:pointer; position:relative; }
        .vip-ad-icon { width:46px; height:46px; background:linear-gradient(135deg,#1e3a6e,#0d2550); border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .vip-ad-icon i { font-size:22px; color:#3b82f6; }
        .vip-info { flex:1; }
        .vip-title { font-size:15px; font-weight:700; color:#fff; margin-bottom:2px; }
        .vip-price { font-size:12px; color:#94a3b8; }
        .vip-user-note { font-size:10px; color:#64748b; margin-top:3px; display:flex; align-items:center; gap:4px; }
        .get-btn { background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.4); color:#60a5fa; padding:8px 14px; border-radius:18px; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:3px; }
        .vip-tag { position:absolute; top:12px; right:12px; background:linear-gradient(135deg,#1d4ed8,#3b82f6); border-radius:7px; padding:2px 7px; font-size:9px; font-weight:800; color:#fff; }

        /* ══════════════════════════════════════════
           AD SPACE
        ══════════════════════════════════════════ */
        .ad-space { background:rgba(0,0,0,0.35); border:1.5px dashed rgba(56,189,248,0.25); border-radius:18px; padding:36px 16px; margin:0 0 16px 0; text-align:center; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
        .ad-space i { font-size:28px; color:#3b82f6; opacity:0.6; }
        .ad-space p { font-size:12px; color:#7e8ca3; font-weight:500; }
        .ad-space .ad-hint { font-size:10px; color:#3d5070; }

        /* ══════════════════════════════════════════
           GLOBAL BOTTOM NAVIGATION BAR
        ══════════════════════════════════════════ */
        .bottom-nav {
            position:fixed; bottom:0; left:50%; transform:translateX(-50%);
            width:100%; max-width:430px;
            background:#070f1e;
            border-top:1px solid rgba(56,189,248,0.10);
            display:flex; z-index:200;
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        .nav-tab {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:8px 4px 7px; cursor:pointer; background:none; border:none;
            color:#4a5f7a; transition:color 0.2s; gap:3px;
        }
        .nav-tab i    { font-size:20px; line-height:1; }
        .nav-tab span { font-size:8.5px; font-weight:700; letter-spacing:0.3px; text-align:center; line-height:1.2; }
        .nav-tab.active { color:#38bdf8; }
        .nav-tab:active { color:#fff; }
        .nav-tab.active::after { content:''; display:block; width:4px; height:4px; background:#38bdf8; border-radius:50%; margin-top:3px; }

        /* Premium tab — stacked crown-over-person icon using pseudo-element */
        .nav-tab.premium-tab { position:relative; }
        .premium-icon-wrap {
            position:relative;
            width:26px; height:26px;
            display:flex; align-items:center; justify-content:center;
        }
        /* Person icon (base) */
        .premium-icon-wrap .icon-person {
            font-size:20px;
            line-height:1;
        }
        /* Crown icon overlaid top-center */
        .premium-icon-wrap .icon-crown {
            position:absolute;
            top:-7px; left:50%;
            transform:translateX(-50%);
            font-size:11px;
            color:#f59e0b; /* amber/gold */
            filter:drop-shadow(0 0 3px rgba(245,158,11,0.7));
        }
        /* When tab is active, person stays current-color; crown stays gold */
        .nav-tab.active .premium-icon-wrap .icon-person { color:#38bdf8; }
        .nav-tab.active .premium-icon-wrap .icon-crown  { color:#f59e0b; }

        /* ══════════════════════════════════════════
           TOASTS  (raised above bottom nav)
        ══════════════════════════════════════════ */
        .error-toast   { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#7f1d1d,#991b1b); border:1px solid #ef4444; color:white; padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; z-index:99999; animation:slideUp 0.3s ease; max-width:340px; width:90%; box-shadow:0 4px 20px rgba(239,68,68,0.4); text-align:center; line-height:1.5; }
        .err-title { font-size:13px; font-weight:800; color:#fca5a5; margin-bottom:3px; display:block; }
        .err-sub   { font-size:11px; color:#fecaca; display:block; margin-top:2px; }
        .success-toast { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#14532d,#166534); border:1px solid #22c55e; color:white; padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; z-index:99999; animation:slideUp 0.3s ease; max-width:340px; width:90%; box-shadow:0 4px 20px rgba(34,197,94,0.4); text-align:center; line-height:1.5; }
        .notification  { position:fixed; bottom:72px; left:50%; transform:translateX(-50%); background:#22c55e; color:#fff; padding:10px 20px; border-radius:40px; font-size:13px; font-weight:700; z-index:99999; animation:slideUp 0.3s ease; white-space:nowrap; }
        @keyframes slideUp { from{opacity:0;transform:translateX(-50%) translateY(20px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

        /* ══════════════════════════════════════════
           NO INTERNET OVERLAY
        ══════════════════════════════════════════ */
        .no-internet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:30000; justify-content:center; align-items:center; }
        .no-internet-overlay.show { display:flex; }
        .no-internet-box { background:#0d1b2e; border:1px solid #ef4444; border-radius:24px; padding:32px; text-align:center; max-width:280px; }
        .no-internet-box h3 { margin:14px 0 8px; font-size:17px; }
        .no-internet-box p  { font-size:13px; color:#64748b; line-height:1.5; }
        .retry-btn { background:#ef4444; border:none; border-radius:40px; padding:11px 28px; color:#fff; font-weight:700; cursor:pointer; margin-top:16px; font-size:14px; }

        button:disabled { opacity:0.6; cursor:not-allowed; }
    </style>
</head>
<body>

<!-- No Internet Overlay -->
<div class="no-internet-overlay" id="noInternetOverlay">
    <div class="no-internet-box">
        <i class="fa-solid fa-wifi" style="font-size:44px;color:#ef4444;"></i>
        <h3>No Internet!</h3>
        <p>Please turn on WiFi or Mobile Data.</p>
        <button class="retry-btn" onclick="retryConnection()">&#x1F504; Retry</button>
    </div>
</div>

<div class="app-wrapper">

    <!-- ── TOP HEADER (three-dots removed; VIP + IG pushed right) ── -->
    <div class="top-header">
        <img class="app-logo-img" id="appLogoImg" src="" alt="Logo">
        <div class="app-name-block">
            <span class="app-name-main">Video Downloader</span>
            <span class="app-name-sub">&amp; My Story Saver</span>
        </div>
        <div class="header-icons">
            <button class="btn-gift"><i class="fa-regular fa-gift"></i></button>
            <div class="btn-vip">
                <div class="vip-shape">
                    <span class="vip-ad-pill">AD</span>
                    <span class="vip-text">VIP</span>
                </div>
            </div>
            <button class="btn-ig"><i class="fa-brands fa-instagram"></i></button>
            <!-- Three-dots button intentionally removed -->
        </div>
    </div>

    <!-- ── SCROLLABLE CONTENT ── -->
    <div class="scroll-content">

        <!-- Platform Selector -->
        <div class="platform-section">
            <div class="platform-row">
                <div class="platform-btn instagram active" data-platform="instagram">
                    <div class="p-icon-wrap"><i class="fa-brands fa-instagram"></i></div>
                    <span>INSTAGRAM</span>
                </div>
                <div class="platform-btn facebook" data-platform="facebook">
                    <div class="p-icon-wrap"><i class="fa-brands fa-facebook-f"></i></div>
                    <span>FACEBOOK</span>
                </div>
            </div>
        </div>

        <!-- Link Input -->
        <div class="input-section">
            <div class="input-box">
                <div class="input-row">
                    <input type="url" id="videoLinkInput"
                           placeholder="Paste Instagram Reel or Facebook video link here...">
                </div>
                <div class="paste-row">
                    <button class="paste-btn" id="pasteBtn">PASTE</button>
                    <button class="clear-x-btn hide-clear" id="clearInputBtn">✕</button>
                </div>
            </div>
        </div>

        <!-- Download Trigger Button -->
        <div class="download-section">
            <button class="download-btn" id="fetchBtn">
                <span id="btnText">DOWNLOAD VIDEO</span>
                <i class="fa-solid fa-arrow-down" id="btnIcon"></i>
                <i class="fa-solid fa-circle-notch loader" id="btnLoader"></i>
            </button>
        </div>

        <!--
            PREVIEW BOX
            ┌──────────────────────────────────────┐
            │ #previewPlaceholder  (idle)           │
            │ #resultContent       (video found)    │
            │   ├─ #thumbWrapper                   │
            │   │    ├─ #thumbPreviewImg           │
            │   │    ├─ .thumb-overlay-tl          │  icon + MB (after download)
            │   │    └─ .thumb-overlay-tr          │  clapperboard (after fetch)
            │   ├─ .result-info                    │
            │   │    ├─ .share-fab  (after fetch)  │  share button top-right
            │   │    └─ .save-btn                  │
            │   └─ .thumb-action-bar (after dl)    │
            └──────────────────────────────────────┘
        -->
        <div class="preview-section">
            <div class="preview-box" id="previewBox">

                <!-- STATE A: Idle -->
                <div id="previewPlaceholder">
                    <div class="film-icon-wrap"><i class="fa-solid fa-film"></i></div>
                    <div class="loading-text">Video preview will appear here</div>
                </div>

                <!-- STATE B: Video found -->
                <div id="resultContent">

                    <div id="thumbWrapper">
                        <img id="thumbPreviewImg" src="" alt="Video Thumbnail">
                        <i class="fa-solid fa-film" id="thumbFallbackIcon"></i>

                        <!-- Top-left: platform icon only at fetch; size added after download -->

/* ══════════════════════════════════════════

function removeAllToasts() {
    document.querySelectorAll('.error-toast,.success-toast,.notification').forEach(e => e.remove());

function showError(type, extra) {
    const m = ERR[type] || ERR.UNKNOWN;
    removeAllToasts();
    const t = document.createElement('div');
    t.className = 'error-toast';
    t.innerHTML = `<span class="err-title">${m.title}</span>${m.msg}` +
                  (extra ? `<span class="err-sub" style="color:#fbbf24;">${extra}</span>` : '');
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 5000);
}

    removeAllToasts();
    const t = document.createElement('div');
    t.className = 'success-toast';
    t.innerHTML = msg + (sub ? `<br><span style="font-size:11px;">${sub}</span>` : '');
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 4000);
}

    removeAllToasts();
    const t = document.createElement('div');
    t.className = 'notification';
    t.innerHTML = msg;

    setTimeout(() => t.remove(), duration);
}

        const manual = prompt('Clipboard access failed.\nPlease paste the link manually:');

        else { showError('CLIPBOARD_FAIL'); return; }

    text = text.trim();

    // Auto-detect platform from the URL before setting input value

        selectPlatform('instagram');

    videoLinkInput.value = text;

}

/* ══════════════════════════════════════════
   FETCH VIDEO
══════════════════════════════════════════ */
async function startDownload() {
    if (!checkInternet()) { showError('NO_INTERNET'); return; }
    const link = videoLinkInput.value.trim();
    if (!link)             { showError('EMPTY_LINK'); return; }
    if (!isValidUrl(link)) { showError('INVALID_LINK'); return; }

    // Auto-correct platform from typed URL
    if ((link.includes('facebook.com') || link.includes('fb.watch')) && currentPlatform !== 'facebook') selectPlatform('facebook');
    if (link.includes('instagram.com') && currentPlatform !== 'instagram') selectPlatform('instagram');

    fetchBtn.disabled       = true;
    btnIcon.style.display   = 'none';
    btnLoader.style.display = 'inline-block';
    btnText.textContent     = 'Searching...';

    const apis = getApiConfigs(link);
    let videoData  = null;
    let allTimeout = true;

    for (let i = 0; i < apis.length; i++) {
        const cfg = apis[i];
        btnText.textContent = `API ${i + 1}/${apis.length}...`;
        try {
            const ctrl = new AbortController();
            const tid  = setTimeout(() => ctrl.abort(), 8000);
            const opts = { method: cfg.method, headers: cfg.headers, signal: ctrl.signal };
            if (cfg.method === 'POST' && cfg.body) opts.body = cfg.body;
            const resp = await fetch(cfg.url, opts);
            clearTimeout(tid);
            allTimeout = false;

            if (resp.ok) {
                const json   = await resp.json();
                const parsed = cfg.parse(json);
                if (parsed?.url?.startsWith('http')) {
                    videoData = parsed;
                    console.log('✅', cfg.name);
                    break;
                }
                if (json?.error?.toLowerCase?.().includes('private')) {
                    resetBtnState();
                    showError('PRIVATE_VIDEO');
                    return;
                }
            }
        } catch (e) {
            if (e.name !== 'AbortError') allTimeout = false;
            console.log('❌', cfg.name, e.message);
        }
    }

    resetBtnState();

    if (videoData?.url) {
        fetchedVideoUrl   = videoData.url;
        fetchedVideoImg   = videoData.img || '';
        const ts          = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
        currentVideoTitle = `${currentPlatform.toUpperCase()}_${ts}`;
        videoTitleDisplay.textContent = currentVideoTitle;

        showResultState(fetchedVideoImg);
        resultContent.scrollIntoView({ behavior:'smooth', block:'center' });
        showNotification('✅ Video found! Tap Save to Gallery', 2000);
    } else {
        showError(allTimeout ? 'TIMEOUT' : 'ALL_API_FAILED');
    }
}

function resetBtnState() {
    fetchBtn.disabled       = false;
    btnIcon.style.display   = 'inline-block';
    btnLoader.style.display = 'none';
    btnText.textContent     = 'DOWNLOAD VIDEO';
}

══════════════════════════════════════════ */
async function downloadVideo() {
    if (!fetchedVideoUrl) { showError('EMPTY_LINK', 'Find video first.'); return; }
    if (!checkInternet()) { showError('NO_INTERNET'); return; }

    saveBtn.disabled          = true;
    saveBtn.textContent       = '⏳ Downloading...';
    progressContainer.style.display = 'block';
    progressBar.style.width   = '10%';
    progressLabel.textContent = 'Starting...';

    const fileName = `${currentVideoTitle}.mp4`;

    try {
        progressBar.style.width   = '20%';
        progressLabel.textContent = 'Fetching video...';

        const ctrl = new AbortController();
        const tid  = setTimeout(() => ctrl.abort(), 60000);
        const resp = await fetch(fetchedVideoUrl, {
            signal: ctrl.signal, mode: 'cors',
            headers: { 'Accept': 'video/mp4,video/*,*/*' }
        });
        clearTimeout(tid);

        if (!resp.ok) throw new Error('HTTP_' + resp.status);
        const ct = resp.headers.get('Content-Type') || '';
        if (ct.includes('text/html') || ct.includes('text/plain')) throw new Error('HTML_RESPONSE');

        progressBar.style.width   = '40%';
        progressLabel.textContent = 'Downloading...';

        const contentLength = resp.headers.get('Content-Length');
        let blob;

        if (contentLength) {
            const total  = parseInt(contentLength);
            const reader = resp.body.getReader();
            const chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                const pct = 40 + Math.round((received / total) * 45);
                progressBar.style.width   = pct + '%';
                progressLabel.textContent = `${(received/1024/1024).toFixed(1)} MB / ${(total/1024/1024).toFixed(1)} MB`;
            }
            blob = new Blob(chunks, { type: 'video/mp4' });
        } else {
            blob = await resp.blob();
        }

        if (blob.size < 5000) throw new Error('BLOB_TOO_SMALL');
        if (blob.type?.includes('text/html')) throw new Error('HTML_BLOB');

        progressBar.style.width   = '90%';
        progressLabel.textContent = 'Saving to Gallery...';

        const blobUrl = URL.createObjectURL(new Blob([blob], { type:'video/mp4' }));
        const a = Object.assign(document.createElement('a'), { href:blobUrl, download:fileName, style:'display:none' });
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 10000);

        progressBar.style.width   = '100%';
        progressLabel.textContent = '✅ Saved to Gallery!';
        saveBtn.textContent       = '✅ Saved to Gallery!';

        showSuccess(`✅ ${fileName} saved to Gallery!`, 'Check your Downloads / Gallery folder.');
        incrementDownloadCount();
        saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);

        // ── POST-DOWNLOAD UI UPDATES ──
        // FIX: Show actual file size (no minus sign, no placeholder text)
        const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
        thumbSizeText.textContent   = `${sizeMB} MB`;
        thumbSizeText.style.display = 'inline'; // reveal size text now

        // FIX: Ensure correct platform icon (guards against any stale state)
        updatePlatformOverlayIcon();

        // Reveal bottom action bar
        thumbActionBar.style.display = 'flex';

    } catch (err) {
        console.warn(err);
        if (err.name === 'AbortError') {
            showError('TIMEOUT');
        } else if (err.message === 'STORAGE_FULL') {
            showError('STORAGE_FULL');
        } else {
            // Fallback: direct anchor download
            try {
                const a2 = Object.assign(document.createElement('a'), { href:fetchedVideoUrl, download:fileName, style:'display:none', rel:'noopener noreferrer' });
                document.body.appendChild(a2); a2.click();
                setTimeout(() => document.body.removeChild(a2), 1000);
                progressBar.style.width   = '100%';
                progressLabel.textContent = '✅ Download started! Check Downloads.';
                saveBtn.textContent       = '✅ Download started!';
                showSuccess('✅ Video download started!', 'Check Files app → Downloads.');
                incrementDownloadCount();
                saveToHistory(currentVideoTitle, fetchedVideoUrl, fetchedVideoImg);
                thumbActionBar.style.display = 'flex';
                updatePlatformOverlayIcon();
                // Fallback: no blob available, so show estimated size from Content-Length header
                // or just clear the loading text gracefully
                thumbSizeText.textContent   = 'Saved ✓';
                thumbSizeText.style.display = 'inline';
            } catch (err2) {
                try {
                    window.open(fetchedVideoUrl, '_blank');
                    saveBtn.textContent = '↗️ Opened in new tab — save from there';
                    showError('WRONG_FILE');
                } catch (err3) {
                    showError('DOWNLOAD_FAIL', err3.message);
                }
            }
        }
    }

    setTimeout(() => {
        progressContainer.style.display = 'none';
        progressBar.style.width         = '0%';
        progressLabel.textContent       = '';
        saveBtn.disabled                = false;
        saveBtn.textContent             = '⬇️ Save to Gallery ⬇️';
    }, 4000);
}

/* ══════════════════════════════════════════
   HISTORY
══════════════════════════════════════════ */
function saveToHistory(name, url, img) {
    if (!historyEnabled) return;
    try {
        const h = JSON.parse(localStorage.getItem('downloader_history') || '[]');
        if (!h.some(x => x.url === url)) {
            h.unshift({ name, url, img, platform: currentPlatform, date: new Date().toISOString() });
            if (h.length > 30) h.pop();
            localStorage.setItem('downloader_history', JSON.stringify(h));
        }
    } catch (e) {}
}

/* ══════════════════════════════════════════
   SHARE HELPER (Web Share API with clipboard fallback)
══════════════════════════════════════════ */
async function triggerShare() {
    if (!fetchedVideoUrl) return;
    if (navigator.share) {
        try { await navigator.share({ title: currentVideoTitle, url: fetchedVideoUrl }); }
        catch (e) { /* cancelled by user */ }
    } else {
        await navigator.clipboard.writeText(fetchedVideoUrl).catch(() => {});
        showNotification('🔗 Video link copied!');
    }
}

// Share FAB (above Save button)
shareFab.addEventListener('click', triggerShare);

// Share inside action bar
document.getElementById('shareActionBtn').addEventListener('click', triggerShare);

/* ══════════════════════════════════════════
   BOTTOM NAVIGATION TABS
══════════════════════════════════════════ */
document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabName = tab.dataset.tab;
        if (tabName === 'premium') {
            showNotification('👑 Local Ad-Free plan coming soon!');
        } else if (tabName === 'downloads') {
            const h = JSON.parse(localStorage.getItem('downloader_history') || '[]');
            showNotification(h.length > 0 ? `📁 ${h.length} video(s) in history` : '📁 No downloads yet');
        } else if (tabName === 'settings') {
            showNotification('⚙️ Settings coming soon!');
        }
        if (tabName !== 'home') {
            setTimeout(() => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelector('.nav-tab[data-tab="home"]').classList.add('active');
            }, 1600);
        }
    });
});

pasteBtn.addEventListener('click', pasteFromClipboard);
fetchBtn.addEventListener('click', startDownload);
saveBtn.addEventListener('click',  downloadVideo);

/* ══════════════════════════════════════════
   INITIALISE
══════════════════════════════════════════ */
showIdleState();
updateButtonsVisibility();
loadSettings();
setTimeout(checkInternet, 500);

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(r  => console.log('SW registered:', r.scope))
            .catch(e => console.warn('SW failed:', e));
    });
}
